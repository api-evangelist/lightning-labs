        description: The type of sync we are currently performing with this peer.
      features:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcFeature'
        description: Features advertised by the remote peer in their init message.
      errors:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcTimestampedError'
        description: 'The latest errors received from our peer with timestamps, limited to the 10

          most recent errors. These errors are tracked across peer connections, but

          are not persisted across lnd restarts. Note that these errors are only

          stored for peers that we have channels open with, to prevent peers from

          spamming us with errors at no cost.'
      flap_count:
        type: integer
        format: int32
        description: 'This field is populated when the peer has at least one channel with us.

          The number of times we have recorded this peer going offline or coming

          online, recorded across restarts. Note that this value is decreased over

          time if the peer has not recently flapped, so that we can forgive peers

          with historically high flap counts.'
      last_flap_ns:
        type: string
        format: int64
        description: 'This field is populated when the peer has at least one channel with us.

          The timestamp of the last flap we observed for this peer. If this value is

          zero, we have not observed any flaps for this peer.'
      last_ping_payload:
        type: string
        format: byte
        description: The last ping payload the peer has sent to us.
  lnrpcAmount:
    type: object
    properties:
      sat:
        type: string
