        description: 'Remaining # of blocks until the commitment output can be swept.

          Negative values indicate how many blocks have passed since becoming

          mature.'
      recovered_balance:
        type: string
        format: int64
        title: The total value of funds successfully recovered from this channel
      pending_htlcs:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcPendingHTLC'
      anchor:
        $ref: '#/definitions/ForceClosedChannelAnchorState'
  lnrpcSendResponse:
    type: object
