      capacity:
        type: string
        format: int64
      node1_policy:
        $ref: '#/definitions/lnrpcRoutingPolicy'
      node2_policy:
        $ref: '#/definitions/lnrpcRoutingPolicy'
      custom_records:
        type: object
        additionalProperties:
          type: string
          format: byte
        description: Custom channel announcement tlv records.
      auth_proof:
        $ref: '#/definitions/lnrpcChannelAuthProof'
        description: 'Authentication proof for this channel. This proof contains a set of

          signatures binding four identities, which attests to the legitimacy of

          the advertised channel. This only is available for advertised channels.

          This field is not filled by default. Pass include_auth_proof flag to

          DescribeGraph, GetNodeInfo or GetChanInfo to get this data.'
    description: 'A fully authenticated channel along with all its unique attributes.

      Once an authenticated channel announcement has been processed on the network,

      then an instance of ChannelEdgeInfo encapsulating the channels attributes is

      stored. The other portions relevant to routing policy of a channel are stored

      within a ChannelEdgePolicy for each direction of the channel.'
  lnrpcTransaction:
    type: object
    properties:
      tx_hash:
        type: string
        title: The transaction hash
      amount:
        type: string
        format: int64
        title: The transaction amount, denominated in satoshis
      num_confirmations:
        type: integer
        format: int32
        title: The number of confirmations
      block_hash:
        type: string
        title: The hash of the block this transaction was included in
      block_height:
        type: integer
        format: int32
        title: The height of the block this transaction was included in
      time_stamp:
        type: string
        format: int64
        title: Timestamp of this transaction
      total_fees:
        type: string
        format: int64
        title: Fees paid for this transaction
      dest_addresses:
        type: array
        items:
          type: string
        description: 'Addresses that received funds for this transaction. Deprecated as it is

          now incorporated in the output_details field.'
      output_details:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcOutputDetail'
        title: Outputs that received funds for this transaction
      raw_tx_hex:
        type: string
        description: The raw transaction hex.
      label:
        type: string
        description: A label that was optionally set on transaction broadcast.
      previous_outpoints:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcPreviousOutPoint'
        description: PreviousOutpoints/Inputs of this transaction.
  lnrpcInstantUpdate:
    type: object
    properties:
      num_pending_htlcs:
        type: integer
        format: int32
        description: 'The number of pending HTLCs that are currently active on the channel.

          These HTLCs need to be resolved before the channel can be closed

          cooperatively.'
  lnrpcHTLCAttempt:
    type: object
    properties:
      attempt_id:
        type: string
        format: uint64
        description: The unique ID that is used for this attempt.
      status:
        $ref: '#/definitions/HTLCAttemptHTLCStatus'
        description: The status of the HTLC.
      route:
        $ref: '#/definitions/lnrpcRoute'
        description: The route taken by this HTLC.
      attempt_time_ns:
        type: string
        format: int64
        description: The time in UNIX nanoseconds at which this HTLC was sent.
      resolve_time_ns:
        type: string
        format: int64
        description: 'The time in UNIX nanoseconds at which this HTLC was settled or failed.

          This value will not be set if the HTLC is still IN_FLIGHT.'
      failure:
        $ref: '#/definitions/lnrpcFailure'
        description: Detailed htlc failure info.
      preimage:
        type: string
        format: byte
        description: The preimage that was used to settle the HTLC.
  lnrpcHop:
    type: object
    properties:
      chan_id:
        type: string
        format: uint64
        description: 'The unique channel ID for the channel. The first 3 bytes are the block

          height, the next 3 the index within the block, and the last 2 bytes are the

          output index for the channel.'
      chan_capacity:
        type: string
        format: int64
      amt_to_forward:
        type: string
        format: int64
      fee:
        type: string
        format: int64
      expiry:
        type: integer
        format: int64
      amt_to_forward_msat:
        type: string
        format: int64
      fee_msat:
        type: string
        format: int64
      pub_key:
        type: string
        description: 'An optional public key of the hop. If the public key is given, the payment

          can be executed without relying on a copy of the channel graph.'
      tlv_payload:
        type: boolean
        description: 'If set to true, then this hop will be encoded using the new variable length

          TLV format. Note that if any custom tlv_records below are specified, then

          this field MUST be set to true for them to be encoded properly.'
      mpp_record:
        $ref: '#/definitions/lnrpcMPPRecord'
        description: 'An optional TLV record that signals the use of an MPP payment. If present,

          the receiver will enforce that the same mpp_record is included in the final

          hop payload of all non-zero payments in the HTLC set. If empty, a regular

          single-shot payment is or was attempted.'
      amp_record:
        $ref: '#/definitions/lnrpcAMPRecord'
        description: 'An optional TLV record that signals the use of an AMP payment. If present,

          the receiver will treat all received payments including the same

          (payment_addr, set_id) pair  as being part of one logical payment. The

          payment will be settled by XORing the root_share''s together and deriving the

          child hashes and preimages according to BOLT XX. Must be used in conjunction

          with mpp_record.'
      custom_records:
        type: object
        additionalProperties:
          type: string
          format: byte
        description: 'An optional set of key-value TLV records. This is useful within the context

          of the SendToRoute call as it allows callers to specify arbitrary K-V pairs

          to drop off at each hop within the onion.'
      metadata:
        type: string
        format: byte
        description: The payment metadata to send along with the payment to the payee.
      blinding_point:
        type: string
        format: byte
        description: 'Blinding point is an optional blinding point included for introduction

          nodes in blinded paths. This field is mandatory for hops that represents

          the introduction point in a blinded path.'
      encrypted_data:
        type: string
        format: byte
        description: 'Encrypted data is a receiver-produced blob of data that provides hops

          in a blinded route with forwarding data. As this data is encrypted by

          the recipient, we will not be able to parse it - it is essentially an

          arbitrary blob of data from our node''s perspective. This field is

          mandatory for all hops in a blinded path, including the introduction

          node.'
      total_amt_msat:
        type: string
        format: uint64
        description: 'The total amount that is sent to the recipient (possibly across multiple

          HTLCs), as specified by the sender when making a payment to a blinded path.

          This value is only set in the final hop payload of a blinded payment. This

          value is analogous to the MPPRecord that is used for regular (non-blinded)

          MPP payments.'
  lnrpcInvoice:
    type: object
    properties:
      memo:
        type: string
        description: 'An optional memo to attach along with the invoice. Used for record keeping

          purposes for the invoice''s creator, and will also be set in the description

          field of the encoded payment request if the description_hash field is not

          being used.'
      r_preimage:
        type: string
        format: byte
        description: 'The hex-encoded preimage (32 byte) which will allow settling an incoming

          HTLC payable to this preimage. When using REST, this field must be encoded

          as base64.'
      r_hash:
        type: string
        format: byte
        description: 'The hash of the preimage. When using REST, this field must be encoded as

          base64.

          Note: Output only, don''t specify for creating an invoice.'
      value:
        type: string
        format: int64
        description: The fields value and value_msat are mutually exclusive.
        title: The value of this invoice in satoshis
      value_msat:
        type: string
        format: int64
        description: The fields value and value_msat are mutually exclusive.
        title: The value of this invoice in millisatoshis
      settled:
        type: boolean
        description: 'Whether this invoice has been fulfilled.


          The field is deprecated. Use the state field instead (compare to SETTLED).'
      creation_date:
        type: string
        format: int64
        description: 'When this invoice was created.

          Measured in seconds since the unix epoch.

          Note: Output only, don''t specify for creating an invoice.'
      settle_date:
        type: string
        format: int64
        description: 'When this invoice was settled.

          Measured in seconds since the unix epoch.

          Note: Output only, don''t specify for creating an invoice.'
      payment_request:
        type: string
        description: 'A bare-bones invoice for a payment within the Lightning Network. With the

          details of the invoice, the sender has all the data necessary to send a

          payment to the recipient.

          Note: Output only, don''t specify for creating an invoice.'
      description_hash:
        type: string
        format: byte
        description: 'Hash (SHA-256) of a description of the payment. Used if the description of

          payment (memo) is too long to naturally fit within the description field

          of an encoded payment request. When using REST, this field must be encoded

          as base64.'
      expiry:
        type: string
        format: int64
        description: Payment request expiry time in seconds. Default is 86400 (24 hours).
      fallback_addr:
        type: string
        description: Fallback on-chain address.
      cltv_expiry:
        type: string
        format: uint64
        description: Delta to use for the time-lock of the CLTV extended to the final hop.
      route_hints:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcRouteHint'
        description: 'Route hints that can each be individually used to assist in reaching the

          invoice''s destination.'
      private:
        type: boolean
        description: 'Whether this invoice should include routing hints for private channels.

          Note: When enabled, if value and value_msat are zero, a large number of

          hints with these channels can be included, which might not be desirable.'
      add_index:
        type: string
        format: uint64
        description: 'The "add" index of this invoice. Each newly created invoice will increment

          this index making it monotonically increasing. Callers to the

          SubscribeInvoices call can use this to instantly get notified of all added

          invoices with an add_index greater than this one.

          Note: Output only, don''t specify for creating an invoice.'
      settle_index:
        type: string
        format: uint64
        description: 'The "settle" index of this invoice. Each newly settled invoice will

          increment this index making it monotonically increasing. Callers to the

          SubscribeInvoices call can use this to instantly get notified of all

          settled invoices with an settle_index greater than this one.

          Note: Output only, don''t specify for creating an invoice.'
      amt_paid:
        type: string
        format: int64
        description: Deprecated, use amt_paid_sat or amt_paid_msat.
      amt_paid_sat:
        type: string
        format: int64
        description: 'The amount that was accepted for this invoice, in satoshis. This will ONLY

          be set if this invoice has been settled or accepted. We provide this field

          as if the invoice was created with a zero value, then we need to record what

          amount was ultimately accepted. Additionally, it''s possible that the sender

          paid MORE that was specified in the original invoice. So we''ll record that

          here as well.

          Note: Output only, don''t specify for creating an invoice.'
      amt_paid_msat:
        type: string
        format: int64
        description: 'The amount that was accepted for this invoice, in millisatoshis. This will

          ONLY be set if this invoice has been settled or accepted. We provide this

          field as if the invoice was created with a zero value, then we need to

          record what amount was ultimately accepted. Additionally, it''s possible that

          the sender paid MORE that was specified in the original invoice. So we''ll

          record that here as well.

          Note: Output only, don''t specify for creating an invoice.'
      state:
        $ref: '#/definitions/InvoiceInvoiceState'
        description: 'The state the invoice is in.

          Note: Output only, don''t specify for creating an invoice.'
      htlcs:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcInvoiceHTLC'
        description: 'List of HTLCs paying to this invoice [EXPERIMENTAL].

          Note: Output only, don''t specify for creating an invoice.'
      features:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcFeature'
        description: 'List of features advertised on the invoice.

          Note: Output only, don''t specify for creating an invoice.'
      is_keysend:
        type: boolean
        description: 'Indicates if this invoice was a spontaneous payment that arrived via keysend

          [EXPERIMENTAL].

          Note: Output only, don''t specify for creating an invoice.'
      payment_addr:
        type: string
        format: byte
        description: 'The payment address of this invoice. This is also called payment secret in

          specifications (e.g. BOLT 11). This value will be used in MPP payments, and

          also for newer invoices that always require the MPP payload for added

          end-to-end security.

          Note: Output only, don''t specify for creating an invoice.'
      is_amp:
        type: boolean
        description: Signals whether or not this is an AMP invoice.
      amp_invoice_state:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcAMPInvoiceState'
        description: 'Maps a 32-byte hex-encoded set ID to the sub-invoice AMP state for the

          given set ID. This field is always populated for AMP invoices, and can be

          used along side LookupInvoice to obtain the HTLC information related to a

          given sub-invoice.

          Note: Output only, don''t specify for creating an invoice.'
        title: '[EXPERIMENTAL]:'
      is_blinded:
        type: boolean
        description: 'Signals that the invoice should include blinded paths to hide the true

          identity of the recipient.'
      blinded_path_config:
        $ref: '#/definitions/lnrpcBlindedPathConfig'
        description: 'Config values to use when creating blinded paths for this invoice. These

          can be used to override the defaults config values provided in by the

          global config. This field is only used if is_blinded is true.'
  lnrpcGraphTopologyUpdate:
    type: object
    properties:
      node_updates:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcNodeUpdate'
      channel_updates:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcChannelEdgeUpdate'
      closed_chans:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcClosedChannelUpdate'
  lnrpcNodeUpdate:
    type: object
    properties:
      addresses:
        type: array
        items:
          type: string
        description: Deprecated, use node_addresses.
      identity_key:
        type: string
      global_features:
        type: string
        format: byte
        description: Deprecated, use features.
      alias:
        type: string
      color:
        type: string
      node_addresses:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcNodeAddress'
      features:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcFeature'
        description: 'Features that the node has advertised in the init message, node

          announcements and invoices.'
  PaymentPaymentStatus:
    type: string
    enum:
    - UNKNOWN
    - IN_FLIGHT
    - SUCCEEDED
    - FAILED
    - INITIATED
    default: UNKNOWN
    description: " - UNKNOWN: Deprecated. This status will never be returned.\n - IN_FLIGHT: Payment has inflight HTLCs.\n - SUCCEEDED: Payment is settled.\n - FAILED: Payment is failed.\n - INITIATED: Payment is created and has not attempted any HTLCs."
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  lnrpcWalletAccountBalance:
    type: object
    properties:
      confirmed_balance:
        type: string
        format: int64
        description: The confirmed balance of the account (with >= 1 confirmations).
      unconfirmed_balance:
        type: string
        format: int64
        description: The unconfirmed balance of the account (with 0 confirmations).
  lnrpcChanPointShim:
    type: object
    properties:
      amt:
        type: string
        format: int64
        description: 'The size of the pre-crafted output to be used as the channel point for this

          channel funding.'
      chan_point:
        $ref: '#/definitions/lnrpcChannelPoint'
        description: The target channel point to refrence in created commitment transactions.
      local_key:
        $ref: '#/definitions/lnrpcKeyDescriptor'
        description: Our local key to use when creating the multi-sig output.
      remote_key:
        type: string
        format: byte
        description: The key of the remote party to use when creating the multi-sig output.
      pending_chan_id:
        type: string
        format: byte
        description: 'If non-zero, then this will be used as the pending channel ID on the wire

          protocol to initate the funding request. This is an optional field, and

          should only be set if the responder is already expecting a specific pending

          channel ID.'
      thaw_height:
        type: integer
        format: int64
        description: 'This uint32 indicates if this channel is to be considered ''frozen''. A frozen

          channel does not allow a cooperative channel close by the initiator. The

          thaw_height is the height that this restriction stops applying to the

          channel. The height can be interpreted in two ways: as a relative height if

          the value is less than 500,000, or as an absolute height otherwise.'
      musig2:
        type: boolean
        description: Indicates that the funding output is using a MuSig2 multi-sig output.
  lnrpcPayReq:
    type: object
    properties:
      destination:
        type: string
      payment_hash:
        type: string
      num_satoshis:
        type: string
        format: int64
      timestamp:
        type: string
        format: int64
      expiry:
        type: string
        format: int64
      description:
        type: string
      description_hash:
        type: string
      fallback_addr:
        type: string
      cltv_expiry:
        type: string
        format: int64
      route_hints:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcRouteHint'
      payment_addr:
        type: string
        format: byte
      num_msat:
        type: string
        format: int64
      features:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcFeature'
      blinded_paths:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcBlindedPaymentPath'
  ChannelCloseSummaryClosureType:
    type: string
    enum:
    - COOPERATIVE_CLOSE
    - LOCAL_FORCE_CLOSE
    - REMOTE_FORCE_CLOSE
    - BREACH_CLOSE
    - FUNDING_CANCELED
    - ABANDONED
    default: COOPERATIVE_CLOSE
  lnrpcChannelAuthProof:
    type: object
    properties:
      node_sig1:
        type: string
        format: byte
        description: 'node_sig1 are the raw bytes of the first node signature encoded

          in DER format.'
      bitcoin_sig1:
        type: string
        format: byte
        description: 'bitcoin_sig1 are the raw bytes of the first bitcoin signature of the

          MultiSigKey key of the channel encoded in DER format.'
      node_sig2:
        type: string
        format: byte
        description: 'node_sig2 are the raw bytes of the second node signature encoded

          in DER format.'
      bitcoin_sig2:
        type: string
        format: byte
        description: 'bitcoin_sig2 are the raw bytes of the second bitcoin signature of the

          MultiSigKey key of the channel encoded in DER format.'
    description: 'ChannelAuthProof is the authentication proof (the signature portion) for a

      channel. Using the four signatures contained in the struct, and some

      auxiliary knowledge (the funding script, node identities, and outpoint) nodes

      on the network are able to validate the authenticity and existence of a

      channel.'
  lnrpcBakeMacaroonResponse:
    type: object
    properties:
      macaroon:
        type: string
        description: The hex encoded macaroon, serialized in binary format.
  lnrpcChanBackupSnapshot:
    type: object
    properties:
      single_chan_backups:
        $ref: '#/definitions/lnrpcChannelBackups'
        description: 'The set of new channels that have been added since the last channel backup

          snapshot was requested.'
      multi_chan_backup:
        $ref: '#/definitions/lnrpcMultiChanBackup'
        description: 'A multi-channel backup that covers all open channels currently known to

          lnd.'
  lnrpcForwardingEvent:
    type: object
    properties:
      timestamp:
        type: string
        format: uint64
        description: 'Timestamp is the time (unix epoch offset) that this circuit was

          completed. Deprecated by timestamp_ns.'
      chan_id_in:
        type: string
        format: uint64
        description: The incoming channel ID that carried the HTLC that created the circuit.
      chan_id_out:
        type: string
        format: uint64
        description: 'The outgoing channel ID that carried the preimage that completed the

          circuit.'
      amt_in:
        type: string
        format: uint64
        description: 'The total amount (in satoshis) of the incoming HTLC that created half

          the circuit.'
      amt_out:
        type: string
        format: uint64
        description: 'The total amount (in satoshis) of the outgoing HTLC that created the

          second half of the circuit.'
      fee:
        type: string
        format: uint64
        description: The total fee (in satoshis) that this payment circuit carried.
      fee_msat:
        type: string
        format: uint64
        description: The total fee (in milli-satoshis) that this payment circuit carried.
      amt_in_msat:
        type: string
        format: uint64
        description: 'The total amount (in milli-satoshis) of the incoming HTLC that created

          half the circuit.'
      amt_out_msat:
        type: string
        format: uint64
        description: 'The total amount (in milli-satoshis) of the outgoing HTLC that created

          the second half of the circuit.'
      timestamp_ns:
        type: string
        format: uint64
        description: 'The number of nanoseconds elapsed since January 1, 1970 UTC when this

          circuit was completed.'
      peer_alias_in:
        type: string
        description: The peer alias of the incoming channel.
      peer_alias_out:
        type: string
        description: The peer alias of the outgoing channel.
      incoming_htlc_id:
        type: string
        format: uint64
        description: 'The ID of the incoming HTLC in the payment circuit. This field is

          optional and is unset for forwarding events happened before v0.20.'
      outgoing_htlc_id:
        type: string
        format: uint64
        description: 'The ID of the outgoing HTLC in the payment circuit. This field is

          optional and may be unset for legacy forwarding events.'
  lnrpcNodeInfo:
    type: object
    properties:
      node:
        $ref: '#/definitions/lnrpcLightningNode'
        description: 'An individual vertex/node within the channel graph. A node is

          connected to other nodes by one or more channel edges emanating from it. As

          the graph is directed, a node will also have an incoming edge attached to

          it for each outgoing edge.'
      num_channels:
        type: integer
        format: int64
        description: The total number of channels for the node.
      total_capacity:
        type: string
        format: int64
        description: The sum of all channels capacity for the node, denominated in satoshis.
      channels:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcChannelEdge'
        description: A list of all public channels for the node.
  PendingChannelsResponsePendingChannel:
    type: object
    properties:
      remote_node_pub:
        type: string
      channel_point:
        type: string
      capacity:
        type: string
        format: int64
      local_balance:
        type: string
        format: int64
      remote_balance:
        type: string
        format: int64
      local_chan_reserve_sat:
        type: string
        format: int64
        description: 'The minimum satoshis this node is required to reserve in its

          balance.'
      remote_chan_reserve_sat:
        type: string
        format: int64
        description: 'The minimum satoshis the other node is required to reserve in its

          balance.'
      initiator:
        $ref: '#/definitions/lnrpcInitiator'
        description: The party that initiated opening the channel.
      commitment_type:
        $ref: '#/definitions/lnrpcCommitmentType'
        description: The commitment type used by this channel.
      num_forwarding_packages:
        type: string
        format: int64
        description: Total number of forwarding packages created in this channel.
      chan_status_flags:
        type: string
        description: A set of flags showing the current state of the channel.
      private:
        type: boolean
        description: Whether this channel is advertised to the network or not.
      memo:
        type: string
        description: 'An optional note-to-self to go along with the channel containing some

          useful information. This is only ever stored locally and in no way

          impacts the channel''s operation.'
      custom_channel_data:
        type: string
        format: byte
        description: Custom channel data that might be populated in custom channels.
  lnrpcForwardingHistoryResponse:
    type: object
    properties:
      forwarding_events:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcForwardingEvent'
        description: 'A list of forwarding events from the time slice of the time series

          specified in the request.'
      last_offset_index:
        type: integer
        format: int64
        description: 'The index of the last time in the set of returned forwarding events. Can

          be used to seek further, pagination style.'
  lnrpcInboundFee:
    type: object
    properties:
      base_fee_msat:
        type: integer
        format: int32
        description: 'The inbound base fee charged regardless of the number of milli-satoshis

          received in the channel. By default, only negative values are accepted.'
      fee_rate_ppm:
        type: integer
        format: int32
        description: 'The effective inbound fee rate in micro-satoshis (parts per million).

          By default, only negative values are accepted.'
  lnrpcInvoiceHTLCState:
    type: string
    enum:
    - ACCEPTED
    - SETTLED
    - CANCELED
    default: ACCEPTED
  lnrpcFundingPsbtVerify:
    type: object
    properties:
      funded_psbt:
        type: string
        format: byte
        description: 'The funded but not yet signed PSBT that sends the exact channel capacity

          amount to the PK script returned in the open channel message in a previous

          step.'
      pending_chan_id:
        type: string
        format: byte
        description: The pending channel ID of the channel to get the PSBT for.
      skip_finalize:
        type: boolean
        description: 'Can only be used if the no_publish flag was set to true in the OpenChannel

          call meaning that the caller is solely responsible for publishing the final

          funding transaction. If skip_finalize is set to true then lnd will not wait

          for a FundingPsbtFinalize state step and instead assumes that a transaction

          with the same TXID as the passed in PSBT will eventually confirm.

          IT IS ABSOLUTELY IMPERATIVE that the TXID of the transaction that is

          eventually published does have the _same TXID_ as the verified PSBT. That

          means no inputs or outputs can change, only signatures can be added. If the

          TXID changes between this call and the publish step then the channel will

          never be created and the funds will be in limbo.'
  lnrpcSendCustomMessageResponse:
    type: object
    properties:
      status:
        type: string
        description: The status of the send operation.
  lnrpcGetRecoveryInfoResponse:
    type: object
    properties:
      recovery_mode:
        type: boolean
        title: Whether the wallet is in recovery mode
      recovery_finished:
        type: boolean
        title: Whether the wallet recovery progress is finished
      progress:
        type: number
        format: double
        description: The recovery progress, ranging from 0 to 1.
  lnrpcWalletBalanceResponse:
    type: object
    properties:
      total_balance:
        type: string
        format: int64
        title: The balance of the wallet
      confirmed_balance:
        type: string
        format: int64
        title: The confirmed balance of a wallet(with >= 1 confirmations)
      unconfirmed_balance:
        type: string
        format: int64
        title: The unconfirmed balance of a wallet(with 0 confirmations)
      locked_balance:
        type: string
        format: int64
        description: 'The total amount of wallet UTXOs held in outputs that are locked for

          other usage.'
      reserved_balance_anchor_chan:
        type: string
        format: int64
        description: The amount of reserve required.
      account_balance:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcWalletAccountBalance'
        description: A mapping of each wallet account's name to its balance.
  lnrpcPendingUpdate:
    type: object
    properties:
      txid:
        type: string
        format: byte
      output_index:
        type: integer
        format: int64
      fee_per_vbyte:
        type: string
        format: int64
      local_close_tx:
        type: boolean
  lnrpcChannelBackup:
    type: object
    properties:
      chan_point:
        $ref: '#/definitions/lnrpcChannelPoint'
        description: Identifies the channel that this backup belongs to.
      chan_backup:
        type: string
        format: byte
        description: 'Is an encrypted single-chan backup. this can be passed to

          RestoreChannelBackups, or the WalletUnlocker Init and Unlock methods in

          order to trigger the recovery protocol. When using REST, this field must be

          encoded as base64.'
  PendingChannelsResponseWaitingCloseChannel:
    type: object
    properties:
      channel:
        $ref: '#/definitions/PendingChannelsResponsePendingChannel'
        title: The pending channel waiting for closing tx to confirm
      limbo_balance:
        type: string
        format: int64
        title: The balance in satoshis encumbered in this channel
      commitments:
        $ref: '#/definitions/PendingChannelsResponseCommitments'
        description: 'A list of valid commitment transactions. Any of these can confirm at

          this point.'
      closing_txid:
        type: string
        title: The transaction id of the closing transaction
      closing_tx_hex:
        type: string
        description: 'The raw hex encoded bytes of the closing transaction. Included if

          include_raw_tx in the request is true.'
      blocks_til_close_confirmed:
        type: integer
        format: int64
        description: 'Remaining number of confirmations until the channel closure is

          considered final and removed from waiting close. Channel closes

          require multiple confirmations for reorg protection — the exact

          number scales with channel capacity. A closing transaction that

          gets reorganized out of the chain resets this counter. When the

          closing transaction is not yet confirmed, this value equals the

          total number of confirmations required.'
      close_height:
        type: integer
        format: int64
        description: 'The block height at which the closing transaction was first confirmed.

          This will be zero if the closing transaction has not yet confirmed, or

          if this information is not available for older channels.'
  lnrpcRoute:
    type: object
    properties:
      total_time_lock:
        type: integer
        format: int64
        description: 'The cumulative (final) time lock across the entire route. This is the CLTV

          value that should be extended to the first hop in the route. All other hops

          will decrement the time-lock as advertised, leaving enough time for all

          hops to wait for or present the payment preimage to complete the payment.'
      total_fees:
        type: string
        format: int64
        description: 'The sum of the fees paid at each hop within the final route. In the case

          of a one-hop payment, this value will be zero as we don''t need to pay a fee

          to ourselves.'
      total_amt:
        type: string
        format: int64
        description: 'The total amount of funds required to complete a payment over this route.

          This value includes the cumulative fees at each hop. As a result, the HTLC

          extended to the first-hop in the route will need to have at least this many

          satoshis, otherwise the route will fail at an intermediate node due to an

          insufficient amount of fees.'
      hops:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcHop'
        description: Contains details concerning the specific forwarding details at each hop.
      total_fees_msat:
        type: string
        format: int64
        description: The total fees in millisatoshis.
      total_amt_msat:
        type: string
        format: int64
        description: The total amount in millisatoshis.
      first_hop_amount_msat:
        type: string
        format: int64
        description: 'The actual on-chain amount that was sent out to the first hop. This value is

          only different from the total_amt_msat field if this is a custom channel

          payment and the value transported in the HTLC is different from the BTC

          amount in the HTLC. If this value is zero, then this is an old payment that

          didn''t have this value yet and can be ignored.'
      custom_channel_data:
        type: string
        format: byte
        description: Custom channel data that might be populated in custom channels.
    description: 'A path through the channel graph which runs over one or more channels in

      succession. This struct carries all the information required to craft the

      Sphinx onion packet, and send the payment along the first hop in the path. A

      route is only selected as valid if all the channels have sufficient capacity to

      carry the initial payment amount after fees are accounted for.'
  lnrpcDisconnectPeerResponse:
    type: object
    properties:
      status:
        type: string
        description: The status of the disconnect operation.
  lnrpcChannelConstraints:
    type: object
    properties:
      csv_delay:
        type: integer
        format: int64
        description: 'The CSV delay expressed in relative blocks. If the channel is force closed,

          we will need to wait for this many blocks before we can regain our funds.'
      chan_reserve_sat:
        type: string
        format: uint64
        description: The minimum satoshis this node is required to reserve in its balance.
      dust_limit_sat:
        type: string
        format: uint64
        description: The dust limit (in satoshis) of the initiator's commitment tx.
      max_pending_amt_msat:
        type: string
        format: uint64
        description: 'The maximum amount of coins in millisatoshis that can be pending in this

          channel.'
      min_htlc_msat:
        type: string
        format: uint64
        description: The smallest HTLC in millisatoshis that the initiator will accept.
      max_accepted_htlcs:
        type: integer
        format: int64
        description: The total number of incoming HTLC's that the initiator will accept.
  lnrpcFundingPsbtFinalize:
    type: object
    properties:
      signed_psbt:
        type: string
        format: byte
        description: 'The funded PSBT that contains all witness data to send the exact channel

          capacity amount to the PK script returned in the open channel message in a

          previous step. Cannot be set at the same time as final_raw_tx.'
      pending_chan_id:
        type: string
        format: byte
        description: The pending channel ID of the channel to get the PSBT for.
      final_raw_tx:
        type: string
        format: byte
        description: 'As an alternative to the signed PSBT with all witness data, the final raw

          wire format transaction can also be specified directly. Cannot be set at the

          same time as signed_psbt.'
  lnrpcResolutionType:
    type: string
    enum:
    - TYPE_UNKNOWN
    - ANCHOR
    - INCOMING_HTLC
    - OUTGOING_HTLC
    - COMMIT
    default: TYPE_UNKNOWN
    description: " - ANCHOR: We resolved an anchor output.\n - INCOMING_HTLC: We are resolving an incoming htlc on chain. This if this htlc is\nclaimed, we swept the incoming htlc with the preimage. If it is timed\nout, our peer swept the timeout path.\n - OUTGOING_HTLC: We are resolving an outgoing htlc on chain. If this htlc is claimed,\nthe remote party swept the htlc with the preimage. If it is timed out,\nwe swept it with the timeout path.\n - COMMIT: We force closed and need to sweep our time locked commitment output."
  lnrpcNodePair:
    type: object
    properties:
      from:
        type: string
        format: byte
        description: 'The sending node of the pair. When using REST, this field must be encoded as

          base64.'
      to:
        type: string
        format: byte
        description: 'The receiving node of the pair. When using REST, this field must be encoded

          as base64.'
  lnrpcLightningNode:
    type: object
    properties:
      last_update:
        type: integer
        format: int64
      pub_key:
        type: string
      alias:
        type: string
      addresses:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcNodeAddress'
      color:
        type: string
      features:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcFeature'
      custom_records:
        type: object
        additionalProperties:
          type: string
          format: byte
        description: Custom node announcement tlv records.
    description: 'An individual vertex/node within the channel graph. A node is

      connected to other nodes by one or more channel edges emanating from it. As the

      graph is directed, a node will also have an incoming edge attached to it for

      each outgoing edge.'
  lnrpcChannelOpenUpdate:
    type: object
    properties:
      channel_point:
        $ref: '#/definitions/lnrpcChannelPoint'
  lnrpcRoutingPolicy:
    type: object
    properties:
      time_lock_delta:
        type: integer
        format: int64
      min_htlc:
        type: string
        format: int64
      fee_base_msat:
        type: string
        format: int64
      fee_rate_milli_msat:
        type: string
        format: int64
      disabled:
        type: boolean
      max_htlc_msat:
        type: string
        format: uint64
      last_update:
        type: integer
        format: int64
      custom_records:
        type: object
        additionalProperties:
          type: string
          format: byte
        description: 'Custom channel update tlv records. These are customized fields that are

          not defined by LND and cannot be extracted.'
      inbound_fee_base_msat:
        type: integer
        format: int32
      inbound_fee_rate_milli_msat:
        type: integer
        format: int32
  PeerSyncType:
    type: string
    enum:
    - UNKNOWN_SYNC
    - ACTIVE_SYNC
    - PASSIVE_SYNC
    - PINNED_SYNC
    default: UNKNOWN_SYNC
    description: " - UNKNOWN_SYNC: Denotes that we cannot determine the peer's current sync type.\n - ACTIVE_SYNC: Denotes that we are actively receiving new graph updates from the peer.\n - PASSIVE_SYNC: Denotes that we are not receiving new graph updates from the peer.\n - PINNED_SYNC: Denotes that this peer is pinned into an active sync."
  lnrpcChannelFeeReport:
    type: object
    properties:
      chan_id:
        type: string
        format: uint64
        description: The short channel id that this fee report belongs to.
      channel_point:
        type: string
        description: The channel that this fee report belongs to.
      base_fee_msat:
        type: string
        format: int64
        description: The base fee charged regardless of the number of milli-satoshis sent.
      fee_per_mil:
        type: string
        format: int64
        description: 'The amount charged per milli-satoshis transferred expressed in

          millionths of a satoshi.'
      fee_rate:
        type: number
        format: double
        description: 'The effective fee rate in milli-satoshis. Computed by dividing the

          fee_per_mil value by 1 million.'
      inbound_base_fee_msat:
        type: integer
        format: int32
        description: The base fee charged regardless of the number of milli-satoshis sent.
      inbound_fee_per_mil:
        type: integer
        format: int32
        description: 'The amount charged per milli-satoshis transferred expressed in

          millionths of a satoshi.'
  ForceClosedChannelAnchorState:
    type: string
    enum:
    - LIMBO
    - RECOVERED
    - LOST
    default: LIMBO
    description: "There are three resolution states for the anchor:\nlimbo, lost and recovered. Derive the current state\nfrom the limbo and recovered balances.\n\n - LIMBO: The recovered_balance is zero and limbo_balance is non-zero.\n - RECOVERED: The recovered_balance is non-zero.\n - LOST: A state that is neither LIMBO nor RECOVERED."
  lnrpcPeerEvent:
    type: object
    properties:
      pub_key:
        type: string
        description: The identity pubkey of the peer.
      type:
        $ref: '#/definitions/PeerEventEventType'
  lnrpcPolicyUpdateResponse:
    type: object
