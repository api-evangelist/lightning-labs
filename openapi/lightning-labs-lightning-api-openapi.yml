swagger: '2.0'
info:
  title: Labs LND Lightning API
  description: REST API for the Lightning Network Daemon (lnd) by Lightning Labs, providing programmatic access to Lightning Network nodes for sending and receiving Bitcoin payments, channel management, wallet operations, and routing.
  version: 1.0.0
consumes:
- application/json
produces:
- application/json
tags:
- name: Lightning
paths:
  /v1/aliases/list:
    get:
      summary: 'lncli: `listaliases`

        ListAliases returns the set of all aliases that have ever existed with

        their confirmed SCID (if it exists) and/or the base SCID (in the case of

        zero conf).'
      operationId: Lightning_ListAliases
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListAliasesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/balance/blockchain:
    get:
      summary: 'lncli: `walletbalance`

        WalletBalance returns total unspent outputs(confirmed and unconfirmed), all

        confirmed unspent outputs and all unconfirmed unspent outputs under control

        of the wallet.'
      operationId: Lightning_WalletBalance
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcWalletBalanceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: account
        description: 'The wallet account the balance is shown for.

          If this is not specified, the balance of the "default" account is shown.'
        in: query
        required: false
        type: string
      - name: min_confs
        description: 'The minimum number of confirmations each one of your outputs used for the

          funding transaction must satisfy. If this is not specified, the default

          value of 1 is used.'
        in: query
        required: false
        type: integer
        format: int32
      tags:
      - Lightning
  /v1/balance/channels:
    get:
      summary: 'lncli: `channelbalance`

        ChannelBalance returns a report on the total funds across all open channels,

        categorized in local/remote, pending local/remote and unsettled local/remote

        balances.'
      operationId: Lightning_ChannelBalance
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcChannelBalanceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/channels:
    get:
      summary: 'lncli: `listchannels`

        ListChannels returns a description of all the open channels that this node

        is a participant in.'
      operationId: Lightning_ListChannels
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListChannelsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: active_only
        in: query
        required: false
        type: boolean
      - name: inactive_only
        in: query
        required: false
        type: boolean
      - name: public_only
        in: query
        required: false
        type: boolean
      - name: private_only
        in: query
        required: false
        type: boolean
      - name: peer
        description: 'Filters the response for channels with a target peer''s pubkey. If peer is

          empty, all channels will be returned.'
        in: query
        required: false
        type: string
        format: byte
      - name: peer_alias_lookup
        description: 'Informs the server if the peer alias lookup per channel should be

          enabled. It is turned off by default in order to avoid degradation of

          performance for existing clients.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
    post:
      summary: 'OpenChannelSync is a synchronous version of the OpenChannel RPC call. This

        call is meant to be consumed by clients to the REST proxy. As with all

        other sync calls, all byte slices are intended to be populated as hex

        encoded strings.'
      operationId: Lightning_OpenChannelSync
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcChannelPoint'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcOpenChannelRequest'
      tags:
      - Lightning
  /v1/channels/abandon/{channel_point.funding_txid_str}/{channel_point.output_index}:
    delete:
      summary: 'lncli: `abandonchannel`

        AbandonChannel removes all channel state from the database except for a

        close summary. This method can be used to get rid of permanently unusable

        channels due to bugs fixed in newer versions of lnd. This method can also be

        used to remove externally funded channels where the funding transaction was

        never broadcast. Only available for non-externally funded channels in dev

        build.'
      operationId: Lightning_AbandonChannel
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcAbandonChannelResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: channel_point.funding_txid_str
        description: 'Hex-encoded string representing the byte-reversed hash of the funding

          transaction.'
        in: path
        required: true
        type: string
      - name: channel_point.output_index
        description: The index of the output of the funding transaction
        in: path
        required: true
        type: integer
        format: int64
      - name: channel_point.funding_txid_bytes
        description: 'Txid of the funding transaction. When using REST, this field must be

          encoded as base64.'
        in: query
        required: false
        type: string
        format: byte
      - name: pending_funding_shim_only
        in: query
        required: false
        type: boolean
      - name: i_know_what_i_am_doing
        description: 'Override the requirement for being in dev mode by setting this to true and

          confirming the user knows what they are doing and this is a potential foot

          gun to lose funds if used on active channels.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/channels/acceptor:
    post:
      summary: 'ChannelAcceptor dispatches a bi-directional streaming RPC in which

        OpenChannel requests are sent to the client and the client responds with

        a boolean that tells LND whether or not to accept the channel. This allows

        node operators to specify their own criteria for accepting inbound channels

        through a single persistent connection.'
      operationId: Lightning_ChannelAcceptor
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcChannelAcceptRequest'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcChannelAcceptRequest
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        description: ' (streaming inputs)'
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcChannelAcceptResponse'
      tags:
      - Lightning
  /v1/channels/backup:
    get:
      summary: 'ExportAllChannelBackups returns static channel backups for all existing

        channels known to lnd. A set of regular singular static channel backups for

        each channel are returned. Additionally, a multi-channel backup is returned

        as well, which contains a single encrypted blob containing the backups of

        each channel.'
      operationId: Lightning_ExportAllChannelBackups
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcChanBackupSnapshot'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/channels/backup/restore:
    post:
      summary: 'lncli: `restorechanbackup`

        RestoreChannelBackups accepts a set of singular channel backups, or a

        single encrypted multi-chan backup and attempts to recover any funds

        remaining within the channel. If we are able to unpack the backup, then the

        new channel will be shown under listchannels, as well as pending channels.'
      operationId: Lightning_RestoreChannelBackups
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcRestoreBackupResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcRestoreChanBackupRequest'
      tags:
      - Lightning
  /v1/channels/backup/subscribe:
    get:
      summary: 'SubscribeChannelBackups allows a client to sub-subscribe to the most up to

        date information concerning the state of all channel backups. Each time a

        new channel is added, we return the new set of channels, along with a

        multi-chan backup containing the backup info for all channels. Each time a

        channel is closed, we send a new update, which contains new new chan back

        ups, but the updated set of encrypted multi-chan backups with the closed

        channel(s) removed.'
      operationId: Lightning_SubscribeChannelBackups
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcChanBackupSnapshot'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcChanBackupSnapshot
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/channels/backup/verify:
    post:
      summary: 'lncli: `verifychanbackup`

        VerifyChanBackup allows a caller to verify the integrity of a channel backup

        snapshot. This method will accept either a packed Single or a packed Multi.

        Specifying both will result in an error.'
      operationId: Lightning_VerifyChanBackup
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcVerifyChanBackupResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcChanBackupSnapshot'
      tags:
      - Lightning
  /v1/channels/backup/{chan_point.funding_txid_str}/{chan_point.output_index}:
    get:
      summary: 'lncli: `exportchanbackup`

        ExportChannelBackup attempts to return an encrypted static channel backup

        for the target channel identified by it channel point. The backup is

        encrypted with a key generated from the aezeed seed of the user. The

        returned backup can either be restored using the RestoreChannelBackup

        method once lnd is running, or via the InitWallet and UnlockWallet methods

        from the WalletUnlocker service.'
      operationId: Lightning_ExportChannelBackup
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcChannelBackup'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: chan_point.funding_txid_str
        description: 'Hex-encoded string representing the byte-reversed hash of the funding

          transaction.'
        in: path
        required: true
        type: string
      - name: chan_point.output_index
        description: The index of the output of the funding transaction
        in: path
        required: true
        type: integer
        format: int64
      - name: chan_point.funding_txid_bytes
        description: 'Txid of the funding transaction. When using REST, this field must be

          encoded as base64.'
        in: query
        required: false
        type: string
        format: byte
      tags:
      - Lightning
  /v1/channels/batch:
    post:
      summary: 'lncli: `batchopenchannel`

        BatchOpenChannel attempts to open multiple single-funded channels in a

        single transaction in an atomic way. This means either all channel open

        requests succeed at once or all attempts are aborted if any of them fail.

        This is the safer variant of using PSBTs to manually fund a batch of

        channels through the OpenChannel RPC.'
      operationId: Lightning_BatchOpenChannel
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcBatchOpenChannelResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcBatchOpenChannelRequest'
      tags:
      - Lightning
  /v1/channels/closed:
    get:
      summary: 'lncli: `closedchannels`

        ClosedChannels returns a description of all the closed channels that

        this node was a participant in.'
      operationId: Lightning_ClosedChannels
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcClosedChannelsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: cooperative
        in: query
        required: false
        type: boolean
      - name: local_force
        in: query
        required: false
        type: boolean
      - name: remote_force
        in: query
        required: false
        type: boolean
      - name: breach
        in: query
        required: false
        type: boolean
      - name: funding_canceled
        in: query
        required: false
        type: boolean
      - name: abandoned
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/channels/pending:
    get:
      summary: 'lncli: `pendingchannels`

        PendingChannels returns a list of all the channels that are currently

        considered "pending". A channel is pending if it has finished the funding

        workflow and is waiting for confirmations for the funding txn, or is in the

        process of closure, either initiated cooperatively or non-cooperatively.'
      operationId: Lightning_PendingChannels
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcPendingChannelsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: include_raw_tx
        description: 'Indicates whether to include the raw transaction hex for

          waiting_close_channels.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/channels/stream:
    post:
      summary: 'lncli: `openchannel`

        OpenChannel attempts to open a singly funded channel specified in the

        request to a remote peer. Users are able to specify a target number of

        blocks that the funding transaction should be confirmed in, or a manual fee

        rate to us for the funding transaction. If neither are specified, then a

        lax block confirmation target is used. Each OpenStatusUpdate will return

        the pending channel ID of the in-progress channel. Depending on the

        arguments specified in the OpenChannelRequest, this pending channel ID can

        then be used to manually progress the channel funding flow.'
      operationId: Lightning_OpenChannel
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcOpenStatusUpdate'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcOpenStatusUpdate
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcOpenChannelRequest'
      tags:
      - Lightning
  /v1/channels/subscribe:
    get:
      summary: 'SubscribeChannelEvents creates a uni-directional stream from the server to

        the client in which any updates relevant to the state of the channels are

        sent over. Events include new active channels, inactive channels, and closed

        channels.'
      operationId: Lightning_SubscribeChannelEvents
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcChannelEventUpdate'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcChannelEventUpdate
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/channels/transaction-stream:
    post:
      summary: 'lncli: `sendpayment`

        Deprecated, use routerrpc.SendPaymentV2. SendPayment dispatches a

        bi-directional streaming RPC for sending payments through the Lightning

        Network. A single RPC invocation creates a persistent bi-directional

        stream allowing clients to rapidly send payments through the Lightning

        Network with a single persistent connection.'
      operationId: Lightning_SendPayment
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcSendResponse'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcSendResponse
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        description: ' (streaming inputs)'
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendRequest'
      tags:
      - Lightning
  /v1/channels/transactions:
    post:
      summary: 'Deprecated, use routerrpc.SendPaymentV2. SendPaymentSync is the synchronous

        non-streaming version of SendPayment. This RPC is intended to be consumed by

        clients of the REST proxy. Additionally, this RPC expects the destination''s

        public key and the payment hash (if any) to be encoded as hex strings.'
      operationId: Lightning_SendPaymentSync
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSendResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendRequest'
      tags:
      - Lightning
  /v1/channels/transactions/route:
    post:
      summary: 'Deprecated, use routerrpc.SendToRouteV2. SendToRouteSync is a synchronous

        version of SendToRoute. It Will block until the payment either fails or

        succeeds.'
      operationId: Lightning_SendToRouteSync
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSendResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendToRouteRequest'
      tags:
      - Lightning
  /v1/channels/{channel_point.funding_txid_str}/{channel_point.output_index}:
    delete:
      summary: 'lncli: `closechannel`

        CloseChannel attempts to close an active channel identified by its channel

        outpoint (ChannelPoint). The actions of this method can additionally be

        augmented to attempt a force close after a timeout period in the case of an

        inactive peer. If a non-force close (cooperative closure) is requested,

        then the user can specify either a target number of blocks until the

        closure transaction is confirmed, or a manual fee rate. If neither are

        specified, then a default lax, block confirmation target is used.'
      operationId: Lightning_CloseChannel
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcCloseStatusUpdate'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcCloseStatusUpdate
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: channel_point.funding_txid_str
        description: 'Hex-encoded string representing the byte-reversed hash of the funding

          transaction.'
        in: path
        required: true
        type: string
      - name: channel_point.output_index
        description: The index of the output of the funding transaction
        in: path
        required: true
        type: integer
        format: int64
      - name: channel_point.funding_txid_bytes
        description: 'Txid of the funding transaction. When using REST, this field must be

          encoded as base64.'
        in: query
        required: false
        type: string
        format: byte
      - name: force
        description: 'If true, then the channel will be closed forcibly. This means the

          current commitment transaction will be signed and broadcast.'
        in: query
        required: false
        type: boolean
      - name: target_conf
        description: 'The target number of blocks that the closure transaction should be

          confirmed by.'
        in: query
        required: false
        type: integer
        format: int32
      - name: sat_per_byte
        description: 'Deprecated, use sat_per_vbyte.

          A manual fee rate set in sat/vbyte that should be used when crafting the

          closure transaction.'
        in: query
        required: false
        type: string
        format: int64
      - name: delivery_address
        description: 'An optional address to send funds to in the case of a cooperative close.

          If the channel was opened with an upfront shutdown script and this field

          is set, the request to close will fail because the channel must pay out

          to the upfront shutdown addresss.'
        in: query
        required: false
        type: string
      - name: sat_per_vbyte
        description: 'A manual fee rate set in sat/vbyte that should be used when crafting the

          closure transaction.'
        in: query
        required: false
        type: string
        format: uint64
      - name: max_fee_per_vbyte
        description: 'The maximum fee rate the closer is willing to pay.


          NOTE: This field is only respected if we''re the initiator of the channel.'
        in: query
        required: false
        type: string
        format: uint64
      - name: no_wait
        description: 'If true, then the rpc call will not block while it awaits a closing txid

          to be broadcasted to the mempool. To obtain the closing tx one has to

          listen to the stream for the particular updates. Moreover if a coop close

          is specified and this flag is set to true the coop closing flow will be

          initiated even if HTLCs are active on the channel. The channel will wait

          until all HTLCs are resolved and then start the coop closing process. The

          channel will be disabled in the meantime and will disallow any new HTLCs.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/chanpolicy:
    post:
      summary: 'lncli: `updatechanpolicy`

        UpdateChannelPolicy allows the caller to update the fee schedule and

        channel policies for all channels globally, or a particular channel.'
      operationId: Lightning_UpdateChannelPolicy
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcPolicyUpdateResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcPolicyUpdateRequest'
      tags:
      - Lightning
  /v1/custommessage:
    post:
      summary: 'lncli: `sendcustom`

        SendCustomMessage sends a custom peer message.'
      operationId: Lightning_SendCustomMessage
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSendCustomMessageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendCustomMessageRequest'
      tags:
      - Lightning
  /v1/custommessage/subscribe:
    get:
      summary: 'lncli: `subscribecustom`

        SubscribeCustomMessages subscribes to a stream of incoming custom peer

        messages.'
      description: 'To include messages with type outside of the custom range (>= 32768) lnd

        needs to be compiled with  the `dev` build tag, and the message type to

        override should be specified in lnd''s experimental protocol configuration.'
      operationId: Lightning_SubscribeCustomMessages
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcCustomMessage'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcCustomMessage
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/debuglevel:
    post:
      summary: 'lncli: `debuglevel`

        DebugLevel allows a caller to programmatically set the logging verbosity of

        lnd. The logging can be targeted according to a coarse daemon-wide logging

        level, or in a granular fashion to specify the logging for a target

        sub-system.'
      operationId: Lightning_DebugLevel
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcDebugLevelResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcDebugLevelRequest'
      tags:
      - Lightning
  /v1/fees:
    get:
      summary: 'lncli: `feereport`

        FeeReport allows the caller to obtain a report detailing the current fee

        schedule enforced by the node globally for each channel.'
      operationId: Lightning_FeeReport
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcFeeReportResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/funding/step:
    post:
      summary: 'FundingStateStep is an advanced funding related call that allows the caller

        to either execute some preparatory steps for a funding workflow, or

        manually progress a funding workflow. The primary way a funding flow is

        identified is via its pending channel ID. As an example, this method can be

        used to specify that we''re expecting a funding flow for a particular

        pending channel ID, for which we need to use specific parameters.

        Alternatively, this can be used to interactively drive PSBT signing for

        funding for partially complete funding transactions.'
      operationId: Lightning_FundingStateStep
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcFundingStateStepResp'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcFundingTransitionMsg'
      tags:
      - Lightning
  /v1/getdebuginfo:
    get:
      summary: 'lncli: ''getdebuginfo''

        GetDebugInfo returns debug information concerning the state of the daemon

        and its subsystems. This includes the full configuration and the latest log

        entries from the log file.'
      operationId: Lightning_GetDebugInfo
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcGetDebugInfoResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: include_log
        description: 'If set to true, the log file content will be included in the response.

          By default, only the config information is returned.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/getinfo:
    get:
      summary: 'lncli: `getinfo`

        GetInfo returns general information concerning the lightning node including

        it''s identity pubkey, alias, the chains it is connected to, and information

        concerning the number of open+pending channels.'
      operationId: Lightning_GetInfo
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcGetInfoResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/getrecoveryinfo:
    get:
      summary: '* lncli: `getrecoveryinfo`

        GetRecoveryInfo returns information concerning the recovery mode including

        whether it''s in a recovery mode, whether the recovery is finished, and the

        progress made so far.'
      operationId: Lightning_GetRecoveryInfo
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcGetRecoveryInfoResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/graph:
    get:
      summary: 'lncli: `describegraph`

        DescribeGraph returns a description of the latest graph state from the

        point of view of the node. The graph information is partitioned into two

        components: all the nodes/vertexes, and all the edges that connect the

        vertexes themselves. As this is a directed graph, the edges also contain

        the node directional specific routing policy which includes: the time lock

        delta, fee information, etc.'
      operationId: Lightning_DescribeGraph
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcChannelGraph'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: include_unannounced
        description: 'Whether unannounced channels are included in the response or not. If set,

          unannounced channels are included. Unannounced channels are both private

          channels, and public channels that are not yet announced to the network.'
        in: query
        required: false
        type: boolean
      - name: include_auth_proof
        description: If true, will include announcements' signatures into ChannelEdge.
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/graph/edge/{chan_id}:
    get:
      summary: 'lncli: `getchaninfo`

        GetChanInfo returns the latest authenticated network announcement for the

        given channel identified by its channel ID: an 8-byte integer which

        uniquely identifies the location of transaction''s funding output within the

        blockchain.'
      operationId: Lightning_GetChanInfo
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcChannelEdge'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: chan_id
        description: 'The unique channel ID for the channel. The first 3 bytes are the block

          height, the next 3 the index within the block, and the last 2 bytes are the

          output index for the channel.'
        in: path
        required: true
        type: string
        format: uint64
      - name: chan_point
        description: 'The channel point of the channel in format funding_txid:output_index. If

          chan_id is specified, this field is ignored.'
        in: query
        required: false
        type: string
      - name: include_auth_proof
        description: If true, will include announcements' signatures into ChannelEdge.
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/graph/info:
    get:
      summary: 'lncli: `getnetworkinfo`

        GetNetworkInfo returns some basic stats about the known channel graph from

        the point of view of the node.'
      operationId: Lightning_GetNetworkInfo
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcNetworkInfo'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/graph/node/{pub_key}:
    get:
      summary: 'lncli: `getnodeinfo`

        GetNodeInfo returns the latest advertised, aggregated, and authenticated

        channel information for the specified node identified by its public key.'
      operationId: Lightning_GetNodeInfo
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcNodeInfo'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: pub_key
        description: The 33-byte hex-encoded compressed public of the target node
        in: path
        required: true
        type: string
      - name: include_channels
        description: If true, will include all known channels associated with the node.
        in: query
        required: false
        type: boolean
      - name: include_auth_proof
        description: 'If true, will include announcements'' signatures into ChannelEdge.

          Depends on include_channels.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/graph/nodemetrics:
    get:
      summary: 'lncli: `getnodemetrics`

        GetNodeMetrics returns node metrics calculated from the graph. Currently

        the only supported metric is betweenness centrality of individual nodes.'
      operationId: Lightning_GetNodeMetrics
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcNodeMetricsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: types
        description: The requested node metrics.
        in: query
        required: false
        type: array
        items:
          type: string
          enum:
          - UNKNOWN
          - BETWEENNESS_CENTRALITY
        collectionFormat: multi
      tags:
      - Lightning
  /v1/graph/routes/{pub_key}/{amt}:
    get:
      summary: 'lncli: `queryroutes`

        QueryRoutes attempts to query the daemon''s Channel Router for a possible

        route to a target destination capable of carrying a specific amount of

        satoshis. The returned route contains the full details required to craft and

        send an HTLC, also including the necessary information that should be

        present within the Sphinx packet encapsulated within the HTLC.'
      description: 'When using REST, the `dest_custom_records` map type can be set by appending

        `&dest_custom_records[<record_number>]=<record_data_base64_url_encoded>`

        to the URL. Unfortunately this map type doesn''t appear in the REST API

        documentation because of a bug in the grpc-gateway library.'
      operationId: Lightning_QueryRoutes
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcQueryRoutesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: pub_key
        description: The 33-byte hex-encoded public key for the payment destination
        in: path
        required: true
        type: string
      - name: amt
        description: 'The amount to send expressed in satoshis.


          The fields amt and amt_msat are mutually exclusive.'
        in: path
        required: true
        type: string
        format: int64
      - name: amt_msat
        description: 'The amount to send expressed in millisatoshis.


          The fields amt and amt_msat are mutually exclusive.'
        in: query
        required: false
        type: string
        format: int64
      - name: final_cltv_delta
        description: 'An optional CLTV delta from the current height that should be used for the

          timelock of the final hop. Note that unlike SendPayment, QueryRoutes does

          not add any additional block padding on top of final_ctlv_delta. This

          padding of a few blocks needs to be added manually or otherwise failures may

          happen when a block comes in while the payment is in flight.


          Note: must not be set if making a payment to a blinded path (delta is

          set by the aggregate parameters provided by blinded_payment_paths)'
        in: query
        required: false
        type: integer
        format: int32
      - name: fee_limit.fixed
        description: 'The fee limit expressed as a fixed amount of satoshis.


          The fields fixed and fixed_msat are mutually exclusive.'
        in: query
        required: false
        type: string
        format: int64
      - name: fee_limit.fixed_msat
        description: 'The fee limit expressed as a fixed amount of millisatoshis.


          The fields fixed and fixed_msat are mutually exclusive.'
        in: query
        required: false
        type: string
        format: int64
      - name: fee_limit.percent
        description: The fee limit expressed as a percentage of the payment amount.
        in: query
        required: false
        type: string
        format: int64
      - name: ignored_nodes
        description: 'A list of nodes to ignore during path finding. When using REST, these fields

          must be encoded as base64.'
        in: query
        required: false
        type: array
        items:
          type: string
          format: byte
        collectionFormat: multi
      - name: source_pub_key
        description: 'The source node where the request route should originated from. If empty,

          self is assumed.'
        in: query
        required: false
        type: string
      - name: use_mission_control
        description: 'If set to true, edge probabilities from mission control will be used to get

          the optimal route.'
        in: query
        required: false
        type: boolean
      - name: cltv_limit
        description: 'An optional maximum total time lock for the route. If the source is empty or

          ourselves, this should not exceed lnd''s `--max-cltv-expiry` setting. If

          zero, then the value of `--max-cltv-expiry` is used as the limit.'
        in: query
        required: false
        type: integer
        format: int64
      - name: dest_custom_records[string]
        description: This is a request variable of the map type. The query format is "map_name[key]=value", e.g. If the map name is Age, the key type is string, and the value type is integer, the query parameter is expressed as Age["bob"]=18
        in: query
        required: false
        type: string
      - name: outgoing_chan_id
        description: 'Deprecated, use outgoing_chan_ids. The channel id of the channel that must

          be taken to the first hop. If zero, any channel may be used.'
        in: query
        required: false
        type: string
        format: uint64
      - name: last_hop_pubkey
        description: The pubkey of the last hop of the route. If empty, any hop may be used.
        in: query
        required: false
        type: string
        format: byte
      - name: dest_features
        description: 'Features assumed to be supported by the final node. All transitive feature

          dependencies must also be set properly. For a given feature bit pair, either

          optional or remote may be set, but not both. If this field is nil or empty,

          the router will try to load destination features from the graph as a

          fallback.


          Note: must not be set if making a payment to a blinded route (features

          are provided in blinded_payment_paths).'
        in: query
        required: false
        type: array
        items:
          type: string
          enum:
          - DATALOSS_PROTECT_REQ
          - DATALOSS_PROTECT_OPT
          - INITIAL_ROUING_SYNC
          - UPFRONT_SHUTDOWN_SCRIPT_REQ
          - UPFRONT_SHUTDOWN_SCRIPT_OPT
          - GOSSIP_QUERIES_REQ
          - GOSSIP_QUERIES_OPT
          - TLV_ONION_REQ
          - TLV_ONION_OPT
          - EXT_GOSSIP_QUERIES_REQ
          - EXT_GOSSIP_QUERIES_OPT
          - STATIC_REMOTE_KEY_REQ
          - STATIC_REMOTE_KEY_OPT
          - PAYMENT_ADDR_REQ
          - PAYMENT_ADDR_OPT
          - MPP_REQ
          - MPP_OPT
          - WUMBO_CHANNELS_REQ
          - WUMBO_CHANNELS_OPT
          - ANCHORS_REQ
          - ANCHORS_OPT
          - ANCHORS_ZERO_FEE_HTLC_REQ
          - ANCHORS_ZERO_FEE_HTLC_OPT
          - ROUTE_BLINDING_REQUIRED
          - ROUTE_BLINDING_OPTIONAL
          - AMP_REQ
          - AMP_OPT
        collectionFormat: multi
      - name: time_pref
        description: 'The time preference for this payment. Set to -1 to optimize for fees

          only, to 1 to optimize for reliability only or a value inbetween for a mix.'
        in: query
        required: false
        type: number
        format: double
      - name: outgoing_chan_ids
        description: 'The channel ids of the channels allowed for the first hop. If empty, any

          channel may be used.'
        in: query
        required: false
        type: array
        items:
          type: string
          format: uint64
        collectionFormat: multi
      tags:
      - Lightning
    post:
      summary: 'lncli: `queryroutes`

        QueryRoutes attempts to query the daemon''s Channel Router for a possible

        route to a target destination capable of carrying a specific amount of

        satoshis. The returned route contains the full details required to craft and

        send an HTLC, also including the necessary information that should be

        present within the Sphinx packet encapsulated within the HTLC.'
      description: 'When using REST, the `dest_custom_records` map type can be set by appending

        `&dest_custom_records[<record_number>]=<record_data_base64_url_encoded>`

        to the URL. Unfortunately this map type doesn''t appear in the REST API

        documentation because of a bug in the grpc-gateway library.'
      operationId: Lightning_QueryRoutes2
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcQueryRoutesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: pub_key
        description: The 33-byte hex-encoded public key for the payment destination
        in: path
        required: true
        type: string
      - name: amt
        description: 'The amount to send expressed in satoshis.


          The fields amt and amt_msat are mutually exclusive.'
        in: path
        required: true
        type: string
        format: int64
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            amt_msat:
              type: string
              format: int64
              description: 'The amount to send expressed in millisatoshis.


                The fields amt and amt_msat are mutually exclusive.'
            final_cltv_delta:
              type: integer
              format: int32
              description: 'An optional CLTV delta from the current height that should be used for the

                timelock of the final hop. Note that unlike SendPayment, QueryRoutes does

                not add any additional block padding on top of final_ctlv_delta. This

                padding of a few blocks needs to be added manually or otherwise failures may

                happen when a block comes in while the payment is in flight.


                Note: must not be set if making a payment to a blinded path (delta is

                set by the aggregate parameters provided by blinded_payment_paths)'
            fee_limit:
              $ref: '#/definitions/lnrpcFeeLimit'
              description: 'The maximum number of satoshis that will be paid as a fee of the payment.

                This value can be represented either as a percentage of the amount being

                sent, or as a fixed amount of the maximum fee the user is willing the pay to

                send the payment. If not specified, lnd will use a default value of 100%

                fees for small amounts (<=1k sat) or 5% fees for larger amounts.'
            ignored_nodes:
              type: array
              items:
                type: string
                format: byte
              description: 'A list of nodes to ignore during path finding. When using REST, these fields

                must be encoded as base64.'
            ignored_edges:
              type: array
              items:
                type: object
                $ref: '#/definitions/lnrpcEdgeLocator'
              description: Deprecated. A list of edges to ignore during path finding.
            source_pub_key:
              type: string
              description: 'The source node where the request route should originated from. If empty,

                self is assumed.'
            use_mission_control:
              type: boolean
              description: 'If set to true, edge probabilities from mission control will be used to get

                the optimal route.'
            ignored_pairs:
              type: array
              items:
                type: object
                $ref: '#/definitions/lnrpcNodePair'
              description: A list of directed node pairs that will be ignored during path finding.
            cltv_limit:
              type: integer
              format: int64
              description: 'An optional maximum total time lock for the route. If the source is empty or

                ourselves, this should not exceed lnd''s `--max-cltv-expiry` setting. If

                zero, then the value of `--max-cltv-expiry` is used as the limit.'
            dest_custom_records[string]:
              type: object
              additionalProperties:
                type: string
                format: byte
              description: 'An optional field that can be used to pass an arbitrary set of TLV records

                to a peer which understands the new records. This can be used to pass

                application specific data during the payment attempt. If the destination

                does not support the specified records, an error will be returned.

                Record types are required to be in the custom range >= 65536. When using

                REST, the values must be encoded as base64.'
            outgoing_chan_id:
              type: string
              format: uint64
              description: 'Deprecated, use outgoing_chan_ids. The channel id of the channel that must

                be taken to the first hop. If zero, any channel may be used.'
            last_hop_pubkey:
              type: string
              format: byte
              description: The pubkey of the last hop of the route. If empty, any hop may be used.
            route_hints:
              type: array
              items:
                type: object
                $ref: '#/definitions/lnrpcRouteHint'
              description: Optional route hints to reach the destination through private channels.
            blinded_payment_paths:
              type: array
              items:
                type: object
                $ref: '#/definitions/lnrpcBlindedPaymentPath'
              description: 'An optional blinded path(s) to reach the destination. Note that the

                introduction node must be provided as the first hop in the route.'
            dest_features:
              type: array
              items:
                $ref: '#/definitions/lnrpcFeatureBit'
              description: 'Features assumed to be supported by the final node. All transitive feature

                dependencies must also be set properly. For a given feature bit pair, either

                optional or remote may be set, but not both. If this field is nil or empty,

                the router will try to load destination features from the graph as a

                fallback.


                Note: must not be set if making a payment to a blinded route (features

                are provided in blinded_payment_paths).'
            time_pref:
              type: number
              format: double
              description: 'The time preference for this payment. Set to -1 to optimize for fees

                only, to 1 to optimize for reliability only or a value inbetween for a mix.'
            outgoing_chan_ids:
              type: array
              items:
                type: string
                format: uint64
              description: 'The channel ids of the channels allowed for the first hop. If empty, any

                channel may be used.'
      tags:
      - Lightning
  /v1/graph/subscribe:
    get:
      summary: 'SubscribeChannelGraph launches a streaming RPC that allows the caller to

        receive notifications upon any changes to the channel graph topology from

        the point of view of the responding node. Events notified include: new

        nodes coming online, nodes updating their authenticated attributes, new

        channels being advertised, updates in the routing policy for a directional

        channel edge, and when channels are closed on-chain.'
      operationId: Lightning_SubscribeChannelGraph
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcGraphTopologyUpdate'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcGraphTopologyUpdate
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/htlc-resolution/{chan_id}/{htlc_index}:
    get:
      summary: 'LookupHtlcResolution retrieves a final htlc resolution from the database.

        If the htlc has no final resolution yet, a NotFound grpc status code is

        returned.'
      operationId: Lightning_LookupHtlcResolution
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcLookupHtlcResolutionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: chan_id
        in: path
        required: true
        type: string
        format: uint64
      - name: htlc_index
        in: path
        required: true
        type: string
        format: uint64
      tags:
      - Lightning
  /v1/invoice/{r_hash_str}:
    get:
      summary: 'lncli: `lookupinvoice`

        LookupInvoice attempts to look up an invoice according to its payment hash.

        The passed payment hash *must* be exactly 32 bytes, if not, an error is

        returned.'
      operationId: Lightning_LookupInvoice
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcInvoice'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: r_hash_str
        description: 'The hex-encoded payment hash of the invoice to be looked up. The passed

          payment hash must be exactly 32 bytes, otherwise an error is returned.

          Deprecated now that the REST gateway supports base64 encoding of bytes

          fields.'
        in: path
        required: true
        type: string
      - name: r_hash
        description: 'The payment hash of the invoice to be looked up. When using REST, this field

          must be encoded as base64.'
        in: query
        required: false
        type: string
        format: byte
      tags:
      - Lightning
  /v1/invoices:
    get:
      summary: 'lncli: `listinvoices`

        ListInvoices returns a list of all the invoices currently stored within the

        database. Any active debug invoices are ignored. It has full support for

        paginated responses, allowing users to query for specific invoices through

        their add_index. This can be done by using either the first_index_offset or

        last_index_offset fields included in the response as the index_offset of the

        next request. By default, the first 100 invoices created will be returned.

        Backwards pagination is also supported through the Reversed flag.'
      operationId: Lightning_ListInvoices
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListInvoiceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: pending_only
        description: 'If set, only invoices that are not settled and not canceled will be returned

          in the response.'
        in: query
        required: false
        type: boolean
      - name: index_offset
        description: 'The index of an invoice that will be used as either the start or end of a

          query to determine which invoices should be returned in the response.'
        in: query
        required: false
        type: string
        format: uint64
      - name: num_max_invoices
        description: The max number of invoices to return in the response to this query.
        in: query
        required: false
        type: string
        format: uint64
      - name: reversed
        description: 'If set, the invoices returned will result from seeking backwards from the

          specified index offset. This can be used to paginate backwards.'
        in: query
        required: false
        type: boolean
      - name: creation_date_start
        description: 'If set, returns all invoices with a creation date greater than or equal

          to it. Measured in seconds since the unix epoch.'
        in: query
        required: false
        type: string
        format: uint64
      - name: creation_date_end
        description: 'If set, returns all invoices with a creation date less than or equal to

          it. Measured in seconds since the unix epoch.'
        in: query
        required: false
        type: string
        format: uint64
      tags:
      - Lightning
    delete:
      summary: 'lncli: `deletecanceledinvoice`

        DeleteCanceledInvoice removes a canceled invoice from the database. If the

        invoice is not in the canceled state, an error will be returned.'
      operationId: Lightning_DeleteCanceledInvoice
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcDelCanceledInvoiceResp'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: invoice_hash
        description: Invoice payment hash to delete.
        in: query
        required: false
        type: string
      tags:
      - Lightning
    post:
      summary: 'lncli: `addinvoice`

        AddInvoice attempts to add a new invoice to the invoice database. Any

        duplicated invoices are rejected, therefore all invoices *must* have a

        unique payment preimage.'
      operationId: Lightning_AddInvoice
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcAddInvoiceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcInvoice'
      tags:
      - Lightning
  /v1/invoices/subscribe:
    get:
      summary: 'SubscribeInvoices returns a uni-directional stream (server -> client) for

        notifying the client of newly added/settled invoices. The caller can

        optionally specify the add_index and/or the settle_index. If the add_index

        is specified, then we''ll first start by sending add invoice events for all

        invoices with an add_index greater than the specified value. If the

        settle_index is specified, then next, we''ll send out all settle events for

        invoices with a settle_index greater than the specified value. One or both

        of these fields can be set. If no fields are set, then we''ll only send out

        the latest add/settle events.'
      operationId: Lightning_SubscribeInvoices
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcInvoice'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcInvoice
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: add_index
        description: 'If specified (non-zero), then we''ll first start by sending out

          notifications for all added indexes with an add_index greater than this

          value. This allows callers to catch up on any events they missed while they

          weren''t connected to the streaming RPC.'
        in: query
        required: false
        type: string
        format: uint64
      - name: settle_index
        description: 'If specified (non-zero), then we''ll first start by sending out

          notifications for all settled indexes with an settle_index greater than

          this value. This allows callers to catch up on any events they missed while

          they weren''t connected to the streaming RPC.'
        in: query
        required: false
        type: string
        format: uint64
      tags:
      - Lightning
  /v1/macaroon:
    post:
      summary: 'lncli: `bakemacaroon`

        BakeMacaroon allows the creation of a new macaroon with custom read and

        write permissions. No first-party caveats are added since this can be done

        offline.'
      operationId: Lightning_BakeMacaroon
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcBakeMacaroonResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcBakeMacaroonRequest'
      tags:
      - Lightning
  /v1/macaroon/checkpermissions:
    post:
      summary: 'CheckMacaroonPermissions checks whether the provided macaroon contains all

        the provided permissions. If the macaroon is valid (e.g. all caveats are

        satisfied), and all permissions provided in the request are met, then

        this RPC returns true.'
      operationId: Lightning_CheckMacaroonPermissions
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcCheckMacPermResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcCheckMacPermRequest'
      tags:
      - Lightning
  /v1/macaroon/ids:
    get:
      summary: 'lncli: `listmacaroonids`

        ListMacaroonIDs returns all root key IDs that are in use.'
      operationId: Lightning_ListMacaroonIDs
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListMacaroonIDsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/macaroon/permissions:
    get:
      summary: 'lncli: `listpermissions`

        ListPermissions lists all RPC method URIs and their required macaroon

        permissions to access them.'
      operationId: Lightning_ListPermissions
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListPermissionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/macaroon/{root_key_id}:
    delete:
      summary: 'lncli: `deletemacaroonid`

        DeleteMacaroonID deletes the specified macaroon ID and invalidates all

        macaroons derived from that ID.'
      operationId: Lightning_DeleteMacaroonID
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcDeleteMacaroonIDResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: root_key_id
        description: The root key ID to be removed.
        in: path
        required: true
        type: string
        format: uint64
      tags:
      - Lightning
  /v1/middleware:
    post:
      summary: 'RegisterRPCMiddleware adds a new gRPC middleware to the interceptor chain. A

        gRPC middleware is software component external to lnd that aims to add

        additional business logic to lnd by observing/intercepting/validating

        incoming gRPC client requests and (if needed) replacing/overwriting outgoing

        messages before they''re sent to the client. When registering the middleware

        must identify itself and indicate what custom macaroon caveats it wants to

        be responsible for. Only requests that contain a macaroon with that specific

        custom caveat are then sent to the middleware for inspection. The other

        option is to register for the read-only mode in which all requests/responses

        are forwarded for interception to the middleware but the middleware is not

        allowed to modify any responses. As a security measure, _no_ middleware can

        modify responses for requests made with _unencumbered_ macaroons!'
      operationId: Lightning_RegisterRPCMiddleware
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcRPCMiddlewareRequest'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcRPCMiddlewareRequest
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: ref_msg_id
        description: 'The request message ID this response refers to. Must always be set when

          giving feedback to an intercept but is ignored for the initial registration

          message.'
        in: query
        required: false
        type: string
        format: uint64
      - name: register.middleware_name
        description: 'The name of the middleware to register. The name should be as informative

          as possible and is logged on registration.'
        in: query
        required: false
        type: string
      - name: register.custom_macaroon_caveat_name
        description: 'The name of the custom macaroon caveat that this middleware is responsible

          for. Only requests/responses that contain a macaroon with the registered

          custom caveat are forwarded for interception to the middleware. The

          exception being the read-only mode: All requests/responses are forwarded to

          a middleware that requests read-only access but such a middleware won''t be

          allowed to _alter_ responses. As a security measure, _no_ middleware can

          change responses to requests made with _unencumbered_ macaroons!

          NOTE: Cannot be used at the same time as read_only_mode.'
        in: query
        required: false
        type: string
      - name: register.read_only_mode
        description: 'Instead of defining a custom macaroon caveat name a middleware can register

          itself for read-only access only. In that mode all requests/responses are

          forwarded to the middleware but the middleware isn''t allowed to alter any of

          the responses.

          NOTE: Cannot be used at the same time as custom_macaroon_caveat_name.'
        in: query
        required: false
        type: boolean
      - name: feedback.error
        description: 'The error to return to the user. If this is non-empty, the incoming gRPC

          stream/request is aborted and the error is returned to the gRPC client. If

          this value is empty, it means the middleware accepts the stream/request/

          response and the processing of it can continue.'
        in: query
        required: false
        type: string
      - name: feedback.replace_response
        description: 'A boolean indicating that the gRPC message should be replaced/overwritten.

          This boolean is needed because in protobuf an empty message is serialized as

          a 0-length or nil byte slice and we wouldn''t be able to distinguish between

          an empty replacement message and the "don''t replace anything" case.'
        in: query
        required: false
        type: boolean
      - name: feedback.replacement_serialized
        description: 'If the replace_response field is set to true, this field must contain the

          binary serialized gRPC message in the protobuf format.'
        in: query
        required: false
        type: string
        format: byte
      tags:
      - Lightning
  /v1/newaddress:
    get:
      summary: 'lncli: `newaddress`

        NewAddress creates a new address under control of the local wallet.'
      operationId: Lightning_NewAddress
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcNewAddressResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: type
        description: The type of address to generate.
        in: query
        required: false
        type: string
        enum:
        - WITNESS_PUBKEY_HASH
        - NESTED_PUBKEY_HASH
        - UNUSED_WITNESS_PUBKEY_HASH
        - UNUSED_NESTED_PUBKEY_HASH
        - TAPROOT_PUBKEY
        - UNUSED_TAPROOT_PUBKEY
        default: WITNESS_PUBKEY_HASH
      - name: account
        description: 'The name of the account to generate a new address for. If empty, the

          default wallet account is used.'
        in: query
        required: false
        type: string
      tags:
      - Lightning
  /v1/onionmessage:
    post:
      summary: 'lncli: `sendonion`

        SendOnionMessage sends an onion message to a peer.'
      operationId: Lightning_SendOnionMessage
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSendOnionMessageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendOnionMessageRequest'
      tags:
      - Lightning
  /v1/onionmessage/subscribe:
    get:
      summary: 'lncli: `subscribeonion`

        SubscribeOnionMessages subscribes to a stream of incoming onion messages.'
      operationId: Lightning_SubscribeOnionMessages
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcOnionMessageUpdate'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcOnionMessageUpdate
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/payment:
    delete:
      summary: 'lncli: `deletepayments`

        DeletePayment deletes an outgoing payment from DB. Note that it will not

        attempt to delete an In-Flight payment, since that would be unsafe.'
      operationId: Lightning_DeletePayment
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcDeletePaymentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: payment_hash
        description: Payment hash to delete.
        in: query
        required: false
        type: string
        format: byte
      - name: failed_htlcs_only
        description: Only delete failed HTLCs from the payment, not the payment itself.
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/payments:
    get:
      summary: 'lncli: `listpayments`

        ListPayments returns a list of all outgoing payments.'
      operationId: Lightning_ListPayments
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListPaymentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: include_incomplete
        description: 'If true, then return payments that have not yet fully completed. This means

          that pending payments, as well as failed payments will show up if this

          field is set to true. This flag doesn''t change the meaning of the indices,

          which are tied to individual payments.'
        in: query
        required: false
        type: boolean
      - name: index_offset
        description: 'The index of a payment that will be used as either the start or end of a

          query to determine which payments should be returned in the response. The

          index_offset is exclusive. In the case of a zero index_offset, the query

          will start with the oldest payment when paginating forwards, or will end

          with the most recent payment when paginating backwards.'
        in: query
        required: false
        type: string
        format: uint64
      - name: max_payments
        description: The maximal number of payments returned in the response to this query.
        in: query
        required: false
        type: string
        format: uint64
      - name: reversed
        description: 'If set, the payments returned will result from seeking backwards from the

          specified index offset. This can be used to paginate backwards. The order

          of the returned payments is always oldest first (ascending index order).'
        in: query
        required: false
        type: boolean
      - name: count_total_payments
        description: 'If set, all payments (complete and incomplete, independent of the

          max_payments parameter) will be counted. Note that setting this to true will

          increase the run time of the call significantly on systems that have a lot

          of payments, as all of them have to be iterated through to be counted.'
        in: query
        required: false
        type: boolean
      - name: creation_date_start
        description: 'If set, returns all payments with a creation date greater than or equal

          to it. Measured in seconds since the unix epoch.'
        in: query
        required: false
        type: string
        format: uint64
      - name: creation_date_end
        description: 'If set, returns all payments with a creation date less than or equal to

          it. Measured in seconds since the unix epoch.'
        in: query
        required: false
        type: string
        format: uint64
      - name: omit_hops
        description: 'If set, omit hop-level route data for HTLC attempts to reduce query

          cost and response size.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
    delete:
      summary: 'lncli: `deletepayments --all`

        DeleteAllPayments deletes all outgoing payments from DB. Note that it will

        not attempt to delete In-Flight payments, since that would be unsafe.'
      operationId: Lightning_DeleteAllPayments
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcDeleteAllPaymentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: failed_payments_only
        description: Only delete failed payments.
        in: query
        required: false
        type: boolean
      - name: failed_htlcs_only
        description: Only delete failed HTLCs from payments, not the payment itself.
        in: query
        required: false
        type: boolean
      - name: all_payments
        description: 'Delete all payments. NOTE: Using this option requires careful

          consideration as it is a destructive operation.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
  /v1/payreq/{pay_req}:
    get:
      summary: 'lncli: `decodepayreq`

        DecodePayReq takes an encoded payment request string and attempts to decode

        it, returning a full description of the conditions encoded within the

        payment request.'
      operationId: Lightning_DecodePayReq
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcPayReq'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: pay_req
        description: The payment request string to be decoded
        in: path
        required: true
        type: string
      tags:
      - Lightning
  /v1/peers:
    get:
      summary: 'lncli: `listpeers`

        ListPeers returns a verbose listing of all currently active peers.'
      operationId: Lightning_ListPeers
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListPeersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: latest_error
        description: 'If true, only the last error that our peer sent us will be returned with

          the peer''s information, rather than the full set of historic errors we have

          stored.'
        in: query
        required: false
        type: boolean
      tags:
      - Lightning
    post:
      summary: 'lncli: `connect`

        ConnectPeer attempts to establish a connection to a remote peer. This is at

        the networking level, and is used for communication between nodes. This is

        distinct from establishing a channel with a peer.'
      operationId: Lightning_ConnectPeer
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcConnectPeerResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcConnectPeerRequest'
      tags:
      - Lightning
  /v1/peers/subscribe:
    get:
      summary: 'SubscribePeerEvents creates a uni-directional stream from the server to

        the client in which any events relevant to the state of peers are sent

        over. Events include peers going online and offline.'
      operationId: Lightning_SubscribePeerEvents
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcPeerEvent'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcPeerEvent
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
      - Lightning
  /v1/peers/{pub_key}:
    delete:
      summary: 'lncli: `disconnect`

        DisconnectPeer attempts to disconnect one peer from another identified by a

        given pubKey. In the case that we currently have a pending or active channel

        with the target peer, then this action will be not be allowed.'
      operationId: Lightning_DisconnectPeer
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcDisconnectPeerResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: pub_key
        description: The pubkey of the node to disconnect from
        in: path
        required: true
        type: string
      tags:
      - Lightning
  /v1/signmessage:
    post:
      summary: 'lncli: `signmessage`

        SignMessage signs a message with this node''s private key. The returned

        signature string is `zbase32` encoded and pubkey recoverable, meaning that

        only the message digest and signature are needed for verification.'
      operationId: Lightning_SignMessage
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSignMessageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSignMessageRequest'
      tags:
      - Lightning
  /v1/stop:
    post:
      summary: 'lncli: `stop`

        StopDaemon will send a shutdown request to the interrupt handler, triggering

        a graceful shutdown of the daemon.'
      operationId: Lightning_StopDaemon
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcStopResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcStopRequest'
      tags:
      - Lightning
  /v1/switch:
    post:
      summary: 'lncli: `fwdinghistory`

        ForwardingHistory allows the caller to query the htlcswitch for a record of

        all HTLCs forwarded within the target time range, and integer offset

        within that time range, for a maximum number of events. If no maximum number

        of events is specified, up to 100 events will be returned. If no time-range

        is specified, then events will be returned in the order that they occured.'
      description: 'A list of forwarding events are returned. The size of each forwarding event

        is 40 bytes, and the max message size able to be returned in gRPC is 4 MiB.

        As a result each message can only contain 50k entries. Each response has

        the index offset of the last entry. The index offset can be provided to the

        request to allow the caller to skip a series of records.'
      operationId: Lightning_ForwardingHistory
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcForwardingHistoryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcForwardingHistoryRequest'
      tags:
      - Lightning
  /v1/transactions:
    get:
      summary: 'lncli: `listchaintxns`

        GetTransactions returns a list describing all the known transactions

        relevant to the wallet.'
      operationId: Lightning_GetTransactions
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcTransactionDetails'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: start_height
        description: 'The height from which to list transactions, inclusive. If this value is

          greater than end_height, transactions will be read in reverse.'
        in: query
        required: false
        type: integer
        format: int32
      - name: end_height
        description: 'The height until which to list transactions, inclusive. To include

          unconfirmed transactions, this value should be set to -1, which will

          return transactions from start_height until the current chain tip and

          unconfirmed transactions. If no end_height is provided, the call will

          default to this option.'
        in: query
        required: false
        type: integer
        format: int32
      - name: account
        description: An optional filter to only include transactions relevant to an account.
        in: query
        required: false
        type: string
      - name: index_offset
        description: 'The index of a transaction that will be used in a query to determine which

          transaction should be returned in the response.'
        in: query
        required: false
        type: integer
        format: int64
      - name: max_transactions
        description: 'The maximal number of transactions returned in the response to this query.

          This value should be set to 0 to return all transactions.'
        in: query
        required: false
        type: integer
        format: int64
      tags:
      - Lightning
    post:
      summary: 'lncli: `sendcoins`

        SendCoins executes a request to send coins to a particular address. Unlike

        SendMany, this RPC call only allows creating a single output at a time. If

        neither target_conf, or sat_per_vbyte are set, then the internal wallet will

        consult its fee model to determine a fee for the default confirmation

        target.'
      operationId: Lightning_SendCoins
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSendCoinsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendCoinsRequest'
      tags:
      - Lightning
  /v1/transactions/fee:
    get:
      summary: 'lncli: `estimatefee`

        EstimateFee asks the chain backend to estimate the fee rate and total fees

        for a transaction that pays to multiple specified outputs.'
      description: 'When using REST, the `AddrToAmount` map type can be set by appending

        `&AddrToAmount[<address>]=<amount_to_send>` to the URL. Unfortunately this

        map type doesn''t appear in the REST API documentation because of a bug in

        the grpc-gateway library.'
      operationId: Lightning_EstimateFee
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcEstimateFeeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: AddrToAmount[string]
        description: This is a request variable of the map type. The query format is "map_name[key]=value", e.g. If the map name is Age, the key type is string, and the value type is integer, the query parameter is expressed as Age["bob"]=18
        in: query
        required: false
        type: string
      - name: target_conf
        description: 'The target number of blocks that this transaction should be confirmed

          by.'
        in: query
        required: false
        type: integer
        format: int32
      - name: min_confs
        description: 'The minimum number of confirmations each one of your outputs used for

          the transaction must satisfy.'
        in: query
        required: false
        type: integer
        format: int32
      - name: spend_unconfirmed
        description: Whether unconfirmed outputs should be used as inputs for the transaction.
        in: query
        required: false
        type: boolean
      - name: coin_selection_strategy
        description: "The strategy to use for selecting coins during fees estimation.\n\n - STRATEGY_USE_GLOBAL_CONFIG: Use the coin selection strategy defined in the global configuration\n(lnd.conf).\n - STRATEGY_LARGEST: Select the largest available coins first during coin selection.\n - STRATEGY_RANDOM: Randomly select the available coins during coin selection."
        in: query
        required: false
        type: string
        enum:
        - STRATEGY_USE_GLOBAL_CONFIG
        - STRATEGY_LARGEST
        - STRATEGY_RANDOM
        default: STRATEGY_USE_GLOBAL_CONFIG
      tags:
      - Lightning
  /v1/transactions/many:
    post:
      summary: 'lncli: `sendmany`

        SendMany handles a request for a transaction that creates multiple specified

        outputs in parallel. If neither target_conf, or sat_per_vbyte are set, then

        the internal wallet will consult its fee model to determine a fee for the

        default confirmation target.'
      operationId: Lightning_SendMany
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcSendManyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcSendManyRequest'
      tags:
      - Lightning
  /v1/transactions/subscribe:
    get:
      summary: 'SubscribeTransactions creates a uni-directional stream from the server to

        the client in which any newly discovered transactions relevant to the

        wallet are sent over.'
      operationId: Lightning_SubscribeTransactions
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/lnrpcTransaction'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of lnrpcTransaction
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: start_height
        description: 'The height from which to list transactions, inclusive. If this value is

          greater than end_height, transactions will be read in reverse.'
        in: query
        required: false
        type: integer
        format: int32
      - name: end_height
        description: 'The height until which to list transactions, inclusive. To include

          unconfirmed transactions, this value should be set to -1, which will

          return transactions from start_height until the current chain tip and

          unconfirmed transactions. If no end_height is provided, the call will

          default to this option.'
        in: query
        required: false
        type: integer
        format: int32
      - name: account
        description: An optional filter to only include transactions relevant to an account.
        in: query
        required: false
        type: string
      - name: index_offset
        description: 'The index of a transaction that will be used in a query to determine which

          transaction should be returned in the response.'
        in: query
        required: false
        type: integer
        format: int64
      - name: max_transactions
        description: 'The maximal number of transactions returned in the response to this query.

          This value should be set to 0 to return all transactions.'
        in: query
        required: false
        type: integer
        format: int64
      tags:
      - Lightning
  /v1/utxos:
    get:
      summary: 'lncli: `listunspent`

        Deprecated, use walletrpc.ListUnspent instead.'
      description: 'ListUnspent returns a list of all utxos spendable by the wallet with a

        number of confirmations between the specified minimum and maximum.'
      operationId: Lightning_ListUnspent
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcListUnspentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: min_confs
        description: The minimum number of confirmations to be included.
        in: query
        required: false
        type: integer
        format: int32
      - name: max_confs
        description: The maximum number of confirmations to be included.
        in: query
        required: false
        type: integer
        format: int32
      - name: account
        description: An optional filter to only include outputs belonging to an account.
        in: query
        required: false
        type: string
      tags:
      - Lightning
  /v1/verifymessage:
    post:
      summary: 'lncli: `verifymessage`

        VerifyMessage verifies a signature over a message and recovers the signer''s

        public key. The signature is only deemed valid if the recovered public key

        corresponds to a node key in the public Lightning network. The signature

        must be zbase32 encoded and signed by an active node in the resident node''s

        channel database. In addition to returning the validity of the signature,

        VerifyMessage also returns the recovered pubkey from the signature.'
      operationId: Lightning_VerifyMessage
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/lnrpcVerifyMessageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/lnrpcVerifyMessageRequest'
      tags:
      - Lightning
definitions:
  lnrpcClosedChannelUpdate:
    type: object
    properties:
      chan_id:
        type: string
        format: uint64
        description: 'The unique channel ID for the channel. The first 3 bytes are the block

          height, the next 3 the index within the block, and the last 2 bytes are the

          output index for the channel.'
      capacity:
        type: string
        format: int64
      closed_height:
        type: integer
        format: int64
      chan_point:
        $ref: '#/definitions/lnrpcChannelPoint'
  lnrpcChannelGraph:
    type: object
    properties:
      nodes:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcLightningNode'
        title: The list of `LightningNode`s in this channel graph
      edges:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcChannelEdge'
        title: The list of `ChannelEdge`s in this channel graph
    description: Returns a new instance of the directed channel graph.
  lnrpcVerifyMessageRequest:
    type: object
    properties:
      msg:
        type: string
        format: byte
        description: 'The message over which the signature is to be verified. When using REST,

          this field must be encoded as base64.'
      signature:
        type: string
        title: The signature to be verified over the given message
  lnrpcPreviousOutPoint:
    type: object
    properties:
      outpoint:
        type: string
        description: The outpoint in format txid:n.
      is_our_output:
        type: boolean
        description: 'Denotes if the outpoint is controlled by the internal wallet.

          The flag will only detect p2wkh, np2wkh and p2tr inputs as its own.'
  lnrpcFundingTransitionMsg:
    type: object
    properties:
      shim_register:
        $ref: '#/definitions/lnrpcFundingShim'
        description: 'The funding shim to register. This should be used before any

          channel funding has began by the remote party, as it is intended as a

          preparatory step for the full channel funding.'
      shim_cancel:
        $ref: '#/definitions/lnrpcFundingShimCancel'
        description: Used to cancel an existing registered funding shim.
      psbt_verify:
        $ref: '#/definitions/lnrpcFundingPsbtVerify'
        description: 'Used to continue a funding flow that was initiated to be executed

          through a PSBT. This step verifies that the PSBT contains the correct

          outputs to fund the channel.'
      psbt_finalize:
        $ref: '#/definitions/lnrpcFundingPsbtFinalize'
        description: 'Used to continue a funding flow that was initiated to be executed

          through a PSBT. This step finalizes the funded and signed PSBT, finishes

          negotiation with the peer and finally publishes the resulting funding

          transaction.'
  lnrpcBakeMacaroonRequest:
    type: object
    properties:
      permissions:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcMacaroonPermission'
        description: The list of permissions the new macaroon should grant.
      root_key_id:
        type: string
        format: uint64
        description: The root key ID used to create the macaroon, must be a positive integer.
      allow_external_permissions:
        type: boolean
        description: 'Informs the RPC on whether to allow external permissions that LND is not

          aware of.'
  lnrpcOutPoint:
    type: object
    properties:
      txid_bytes:
        type: string
        format: byte
        description: Raw bytes representing the transaction id.
      txid_str:
        type: string
        description: Reversed, hex-encoded string representing the transaction id.
      output_index:
        type: integer
        format: int64
        description: The index of the output on the transaction.
  lnrpcRPCMiddlewareRequest:
    type: object
    properties:
      request_id:
        type: string
        format: uint64
        description: 'The unique ID of the intercepted original gRPC request. Useful for mapping

          request to response when implementing full duplex message interception. For

          streaming requests, this will be the same ID for all incoming and outgoing

          middleware intercept messages of the _same_ stream.'
      raw_macaroon:
        type: string
        format: byte
        description: 'The raw bytes of the complete macaroon as sent by the gRPC client in the

          original request. This might be empty for a request that doesn''t require

          macaroons such as the wallet unlocker RPCs.'
      custom_caveat_condition:
        type: string
        title: 'The parsed condition of the macaroon''s custom caveat for convenient access.

          This field only contains the value of the custom caveat that the handling

          middleware has registered itself for. The condition _must_ be validated for

          messages of intercept_type stream_auth and request!'
      stream_auth:
        $ref: '#/definitions/lnrpcStreamAuth'
        description: 'Intercept stream authentication: each new streaming RPC call that is

          initiated against lnd and contains the middleware''s custom macaroon

          caveat can be approved or denied based upon the macaroon in the stream

          header. This message will only be sent for streaming RPCs, unary RPCs

          must handle the macaroon authentication in the request interception to

          avoid an additional message round trip between lnd and the middleware.'
      request:
        $ref: '#/definitions/lnrpcRPCMessage'
        description: 'Intercept incoming gRPC client request message: all incoming messages,

          both on streaming and unary RPCs, are forwarded to the middleware for

          inspection. For unary RPC messages the middleware is also expected to

          validate the custom macaroon caveat of the request.'
      response:
        $ref: '#/definitions/lnrpcRPCMessage'
        description: 'Intercept outgoing gRPC response message: all outgoing messages, both on

          streaming and unary RPCs, are forwarded to the middleware for inspection

          and amendment. The response in this message is the original response as

          it was generated by the main RPC server. It can either be accepted

          (=forwarded to the client), replaced/overwritten with a new message of

          the same type, or replaced by an error message.'
      reg_complete:
        type: boolean
        description: 'This is used to indicate to the client that the server has successfully

          registered the interceptor. This is only used in the very first message

          that the server sends to the client after the client sends the server

          the middleware registration message.'
      msg_id:
        type: string
        format: uint64
        description: 'The unique message ID of this middleware intercept message. There can be

          multiple middleware intercept messages per single gRPC request (one for the

          incoming request and one for the outgoing response) or gRPC stream (one for

          each incoming message and one for each outgoing response). This message ID

          must be referenced when responding (accepting/rejecting/modifying) to an

          intercept message.'
      metadata_pairs:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcMetadataValues'
        description: 'The metadata pairs that were sent along with the original gRPC request via

          the golang context.Context using explicit [gRPC

          metadata](https://grpc.io/docs/guides/metadata/). Context values are not

          propagated via gRPC and so we send any pairs along explicitly here so that

          the interceptor can access them.'
  lnrpcPsbtShim:
    type: object
    properties:
      pending_chan_id:
        type: string
        format: byte
        description: 'A unique identifier of 32 random bytes that will be used as the pending

          channel ID to identify the PSBT state machine when interacting with it and

          on the wire protocol to initiate the funding request.'
      base_psbt:
        type: string
        format: byte
        description: 'An optional base PSBT the new channel output will be added to. If this is

          non-empty, it must be a binary serialized PSBT.'
      no_publish:
        type: boolean
        description: 'If a channel should be part of a batch (multiple channel openings in one

          transaction), it can be dangerous if the whole batch transaction is

          published too early before all channel opening negotiations are completed.

          This flag prevents this particular channel from broadcasting the transaction

          after the negotiation with the remote peer. In a batch of channel openings

          this flag should be set to true for every channel but the very last.'
  lnrpcPaymentFailureReason:
    type: string
    enum:
    - FAILURE_REASON_NONE
    - FAILURE_REASON_TIMEOUT
    - FAILURE_REASON_NO_ROUTE
    - FAILURE_REASON_ERROR
    - FAILURE_REASON_INCORRECT_PAYMENT_DETAILS
    - FAILURE_REASON_INSUFFICIENT_BALANCE
    - FAILURE_REASON_CANCELED
    default: FAILURE_REASON_NONE
    description: " - FAILURE_REASON_NONE: Payment isn't failed (yet).\n - FAILURE_REASON_TIMEOUT: There are more routes to try, but the payment timeout was exceeded.\n - FAILURE_REASON_NO_ROUTE: All possible routes were tried and failed permanently. Or were no\nroutes to the destination at all.\n - FAILURE_REASON_ERROR: A non-recoverable error has occured.\n - FAILURE_REASON_INCORRECT_PAYMENT_DETAILS: Payment details incorrect (unknown hash, invalid amt or\ninvalid final cltv delta)\n - FAILURE_REASON_INSUFFICIENT_BALANCE: Insufficient local balance.\n - FAILURE_REASON_CANCELED: The payment was canceled."
  lnrpcChannelBackups:
    type: object
    properties:
      chan_backups:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcChannelBackup'
        description: A set of single-chan static channel backups.
  lnrpcCloseOutput:
    type: object
    properties:
      amount_sat:
        type: string
        format: int64
        description: 'The amount in satoshi of this close output. This amount is the final

          commitment balance of the channel and the actual amount paid out on chain

          might be smaller due to subtracted fees.'
      pk_script:
        type: string
        format: byte
        description: The pkScript of the close output.
      is_local:
        type: boolean
        description: Whether this output is for the local or remote node.
      custom_channel_data:
        type: string
        format: byte
        description: 'The TLV encoded custom channel data records for this output, which might

          be set for custom channels.'
  lnrpcNewAddressResponse:
    type: object
    properties:
      address:
        type: string
        title: The newly generated wallet address
  lnrpcBlindedHop:
    type: object
    properties:
      blinded_node:
        type: string
        format: byte
        description: The blinded public key of the node.
      encrypted_data:
        type: string
        format: byte
        description: An encrypted blob of data provided to the blinded node.
  lnrpcFeatureBit:
    type: string
    enum:
    - DATALOSS_PROTECT_REQ
    - DATALOSS_PROTECT_OPT
    - INITIAL_ROUING_SYNC
    - UPFRONT_SHUTDOWN_SCRIPT_REQ
    - UPFRONT_SHUTDOWN_SCRIPT_OPT
    - GOSSIP_QUERIES_REQ
    - GOSSIP_QUERIES_OPT
    - TLV_ONION_REQ
    - TLV_ONION_OPT
    - EXT_GOSSIP_QUERIES_REQ
    - EXT_GOSSIP_QUERIES_OPT
    - STATIC_REMOTE_KEY_REQ
    - STATIC_REMOTE_KEY_OPT
    - PAYMENT_ADDR_REQ
    - PAYMENT_ADDR_OPT
    - MPP_REQ
    - MPP_OPT
    - WUMBO_CHANNELS_REQ
    - WUMBO_CHANNELS_OPT
    - ANCHORS_REQ
    - ANCHORS_OPT
    - ANCHORS_ZERO_FEE_HTLC_REQ
    - ANCHORS_ZERO_FEE_HTLC_OPT
    - ROUTE_BLINDING_REQUIRED
    - ROUTE_BLINDING_OPTIONAL
    - AMP_REQ
    - AMP_OPT
    default: DATALOSS_PROTECT_REQ
  lnrpcOutputDetail:
    type: object
    properties:
      output_type:
        $ref: '#/definitions/lnrpcOutputScriptType'
        title: The type of the output
      address:
        type: string
        title: The address
      pk_script:
        type: string
        title: The pkscript in hex
      output_index:
        type: string
        format: int64
        title: The output index used in the raw transaction
      amount:
        type: string
        format: int64
        title: The value of the output coin in satoshis
      is_our_address:
        type: boolean
        title: Denotes if the output is controlled by the internal wallet
  lnrpcHTLC:
    type: object
    properties:
      incoming:
        type: boolean
      amount:
        type: string
        format: int64
      hash_lock:
        type: string
        format: byte
      expiration_height:
        type: integer
        format: int64
      htlc_index:
        type: string
        format: uint64
        description: Index identifying the htlc on the channel.
      forwarding_channel:
        type: string
        format: uint64
        description: 'If this HTLC is involved in a forwarding operation, this field indicates

          the forwarding channel. For an outgoing htlc, it is the incoming channel.

          For an incoming htlc, it is the outgoing channel. When the htlc

          originates from this node or this node is the final destination,

          forwarding_channel will be zero. The forwarding channel will also be zero

          for htlcs that need to be forwarded but don''t have a forwarding decision

          persisted yet.'
      forwarding_htlc_index:
        type: string
        format: uint64
        description: Index identifying the htlc on the forwarding channel.
      locked_in:
        type: boolean
        description: 'Whether the HTLC is locked in. An HTLC is considered locked in when the

          remote party has sent us the `revoke_and_ack` to irrevocably commit this

          HTLC.'
  lnrpcKeyLocator:
    type: object
    properties:
      key_family:
        type: integer
        format: int32
        description: The family of key being identified.
      key_index:
        type: integer
        format: int32
        description: The precise index of the key being identified.
  lnrpcEstimateFeeResponse:
    type: object
    properties:
      fee_sat:
        type: string
        format: int64
        description: The total fee in satoshis.
      feerate_sat_per_byte:
        type: string
        format: int64
        description: 'Deprecated, use sat_per_vbyte.

          The fee rate in satoshi/vbyte.'
      sat_per_vbyte:
        type: string
        format: uint64
        description: The fee rate in satoshi/vbyte.
      inputs:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcOutPoint'
        description: A list of selected inputs for the transaction the estimate is for.
  lnrpcCheckMacPermResponse:
    type: object
    properties:
      valid:
        type: boolean
  lnrpcCustomMessage:
    type: object
    properties:
      peer:
        type: string
        format: byte
        title: Peer from which the message originates
      type:
        type: integer
        format: int64
        description: Message type. This value will be in the custom range (>= 32768).
      data:
        type: string
        format: byte
        title: Raw message data
  lnrpcUtxo:
    type: object
    properties:
      address_type:
        $ref: '#/definitions/lnrpcAddressType'
        title: The type of address
      address:
        type: string
        title: The address
      amount_sat:
        type: string
        format: int64
        title: The value of the unspent coin in satoshis
      pk_script:
        type: string
        title: The pkscript in hex
      outpoint:
        $ref: '#/definitions/lnrpcOutPoint'
        title: The outpoint in format txid:n
      confirmations:
        type: string
        format: int64
        title: The number of confirmations for the Utxo
  lnrpcTransactionDetails:
    type: object
    properties:
      transactions:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcTransaction'
        description: The list of transactions relevant to the wallet.
      last_index:
        type: string
        format: uint64
        description: 'The index of the last item in the set of returned transactions. This can be

          used to seek further, pagination style.'
      first_index:
        type: string
        format: uint64
        description: 'The index of the last item in the set of returned transactions. This can be

          used to seek backwards, pagination style.'
  lnrpcRPCMessage:
    type: object
    properties:
      method_full_uri:
        type: string
        description: 'The full URI (in the format /<rpcpackage>.<ServiceName>/MethodName, for

          example /lnrpc.Lightning/GetInfo) of the RPC method the message was sent

          to/from.'
      stream_rpc:
        type: boolean
        description: Indicates whether the message was sent over a streaming RPC method or not.
      type_name:
        type: string
        description: 'The full canonical gRPC name of the message type (in the format

          <rpcpackage>.TypeName, for example lnrpc.GetInfoRequest). In case of an

          error being returned from lnd, this simply contains the string "error".'
      serialized:
        type: string
        format: byte
        description: 'The full content of the gRPC message, serialized in the binary protobuf

          format.'
      is_error:
        type: boolean
        description: 'Indicates that the response from lnd was an error, not a gRPC response. If

          this is set to true then the type_name contains the string "error" and

          serialized contains the error string.'
  lnrpcChannelCloseSummary:
    type: object
    properties:
      channel_point:
        type: string
        description: The outpoint (txid:index) of the funding transaction.
      chan_id:
        type: string
        format: uint64
        description: The unique channel ID for the channel.
      chain_hash:
        type: string
        description: The hash of the genesis block that this channel resides within.
      closing_tx_hash:
        type: string
        description: The txid of the transaction which ultimately closed this channel.
      remote_pubkey:
        type: string
        description: Public key of the remote peer that we formerly had a channel with.
      capacity:
        type: string
        format: int64
        description: Total capacity of the channel.
      close_height:
        type: integer
        format: int64
        description: Height at which the funding transaction was spent.
      settled_balance:
        type: string
        format: int64
        title: Settled balance at the time of channel closure
      time_locked_balance:
        type: string
        format: int64
        title: The sum of all the time-locked outputs at the time of channel closure
      close_type:
        $ref: '#/definitions/ChannelCloseSummaryClosureType'
        description: Details on how the channel was closed.
      open_initiator:
        $ref: '#/definitions/lnrpcInitiator'
        description: 'Open initiator is the party that initiated opening the channel. Note that

          this value may be unknown if the channel was closed before we migrated to

          store open channel information after close.'
      close_initiator:
        $ref: '#/definitions/lnrpcInitiator'
        description: 'Close initiator indicates which party initiated the close. This value will

          be unknown for channels that were cooperatively closed before we started

          tracking cooperative close initiators. Note that this indicates which party

          initiated a close, and it is possible for both to initiate cooperative or

          force closes, although only one party''s close will be confirmed on chain.'
      resolutions:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcResolution'
      alias_scids:
        type: array
        items:
          type: string
          format: uint64
        description: 'This lists out the set of alias short channel ids that existed for the

          closed channel. This may be empty.'
      zero_conf_confirmed_scid:
        type: string
        format: uint64
        description: The confirmed SCID for a zero-conf channel.
      custom_channel_data:
        type: string
        format: byte
        description: 'The TLV encoded custom channel data records for this output, which might

          be set for custom channels.'
  lnrpcOutputScriptType:
    type: string
    enum:
    - SCRIPT_TYPE_PUBKEY_HASH
    - SCRIPT_TYPE_SCRIPT_HASH
    - SCRIPT_TYPE_WITNESS_V0_PUBKEY_HASH
    - SCRIPT_TYPE_WITNESS_V0_SCRIPT_HASH
    - SCRIPT_TYPE_PUBKEY
    - SCRIPT_TYPE_MULTISIG
    - SCRIPT_TYPE_NULLDATA
    - SCRIPT_TYPE_NON_STANDARD
    - SCRIPT_TYPE_WITNESS_UNKNOWN
    - SCRIPT_TYPE_WITNESS_V1_TAPROOT
    default: SCRIPT_TYPE_PUBKEY_HASH
  lnrpcUpdateFailure:
    type: string
    enum:
    - UPDATE_FAILURE_UNKNOWN
    - UPDATE_FAILURE_PENDING
    - UPDATE_FAILURE_NOT_FOUND
    - UPDATE_FAILURE_INTERNAL_ERR
    - UPDATE_FAILURE_INVALID_PARAMETER
    default: UPDATE_FAILURE_UNKNOWN
  lnrpcChannel:
    type: object
    properties:
      active:
        type: boolean
        title: Whether this channel is active or not
      remote_pubkey:
        type: string
        title: The identity pubkey of the remote node
      channel_point:
        type: string
        description: 'The outpoint (txid:index) of the funding transaction. With this value, Bob

          will be able to generate a signature for Alice''s version of the commitment

          transaction.'
      chan_id:
        type: string
        format: uint64
        description: 'The unique channel ID for the channel. The first 3 bytes are the block

          height, the next 3 the index within the block, and the last 2 bytes are the

          output index for the channel.'
      capacity:
        type: string
        format: int64
        title: The total amount of funds held in this channel
      local_balance:
        type: string
        format: int64
        title: This node's current balance in this channel
      remote_balance:
        type: string
        format: int64
        title: The counterparty's current balance in this channel
      commit_fee:
        type: string
        format: int64
        description: 'The amount calculated to be paid in fees for the current set of commitment

          transactions. The fee amount is persisted with the channel in order to

          allow the fee amount to be removed and recalculated with each channel state

          update, including updates that happen after a system restart.'
      commit_weight:
        type: string
        format: int64
        title: The weight of the commitment transaction
      fee_per_kw:
        type: string
        format: int64
        description: 'The required number of satoshis per kilo-weight that the requester will pay

          at all times, for both the funding transaction and commitment transaction.

          This value can later be updated once the channel is open.'
      unsettled_balance:
        type: string
        format: int64
        title: The unsettled balance in this channel
      total_satoshis_sent:
        type: string
        format: int64
        description: The total number of satoshis we've sent within this channel.
      total_satoshis_received:
        type: string
        format: int64
        description: The total number of satoshis we've received within this channel.
      num_updates:
        type: string
        format: uint64
        description: The total number of updates conducted within this channel.
      pending_htlcs:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcHTLC'
        description: The list of active, uncleared HTLCs currently pending within the channel.
      csv_delay:
        type: integer
        format: int64
        description: 'Deprecated. The CSV delay expressed in relative blocks. If the channel is

          force closed, we will need to wait for this many blocks before we can regain

          our funds.'
      private:
        type: boolean
        description: Whether this channel is advertised to the network or not.
      initiator:
        type: boolean
        description: True if we were the ones that created the channel.
      chan_status_flags:
        type: string
        description: A set of flags showing the current state of the channel.
      local_chan_reserve_sat:
        type: string
        format: int64
        description: 'Deprecated. The minimum satoshis this node is required to reserve in its

          balance.'
      remote_chan_reserve_sat:
        type: string
        format: int64
        description: 'Deprecated. The minimum satoshis the other node is required to reserve in

          its balance.'
      static_remote_key:
        type: boolean
        description: Deprecated. Use commitment_type.
      commitment_type:
        $ref: '#/definitions/lnrpcCommitmentType'
        description: The commitment type used by this channel.
      lifetime:
        type: string
        format: int64
        description: 'The number of seconds that the channel has been monitored by the channel

          scoring system. Scores are currently not persisted, so this value may be

          less than the lifetime of the channel [EXPERIMENTAL].'
      uptime:
        type: string
        format: int64
        description: 'The number of seconds that the remote peer has been observed as being online

          by the channel scoring system over the lifetime of the channel

          [EXPERIMENTAL].'
      close_address:
        type: string
        description: 'Close address is the address that we will enforce payout to on cooperative

          close if the channel was opened utilizing option upfront shutdown. This

          value can be set on channel open by setting close_address in an open channel

          request. If this value is not set, you can still choose a payout address by

          cooperatively closing with the delivery_address field set.'
      push_amount_sat:
        type: string
        format: uint64
        description: 'The amount that the initiator of the channel optionally pushed to the remote

          party on channel open. This amount will be zero if the channel initiator did

          not push any funds to the remote peer. If the initiator field is true, we

          pushed this amount to our peer, if it is false, the remote peer pushed this

          amount to us.'
      thaw_height:
        type: integer
        format: int64
        description: 'This uint32 indicates if this channel is to be considered ''frozen''. A

          frozen channel doest not allow a cooperative channel close by the

          initiator. The thaw_height is the height that this restriction stops

          applying to the channel. This field is optional, not setting it or using a

          value of zero will mean the channel has no additional restrictions. The

          height can be interpreted in two ways: as a relative height if the value is

          less than 500,000, or as an absolute height otherwise.'
      local_constraints:
        $ref: '#/definitions/lnrpcChannelConstraints'
        description: List constraints for the local node.
      remote_constraints:
        $ref: '#/definitions/lnrpcChannelConstraints'
        description: List constraints for the remote node.
      alias_scids:
        type: array
        items:
          type: string
          format: uint64
        description: 'This lists out the set of alias short channel ids that exist for a channel.

          This may be empty.'
      zero_conf:
        type: boolean
        description: Whether or not this is a zero-conf channel.
      zero_conf_confirmed_scid:
        type: string
        format: uint64
        description: This is the confirmed / on-chain zero-conf SCID.
      peer_alias:
        type: string
        description: The configured alias name of our peer.
      peer_scid_alias:
        type: string
        format: uint64
        description: This is the peer SCID alias.
      memo:
        type: string
        description: 'An optional note-to-self to go along with the channel containing some

          useful information. This is only ever stored locally and in no way impacts

          the channel''s operation.'
      custom_channel_data:
        type: string
        format: byte
        description: Custom channel data that might be populated in custom channels.
  lnrpcOpenStatusUpdate:
    type: object
    properties:
      chan_pending:
        $ref: '#/definitions/lnrpcPendingUpdate'
        description: 'Signals that the channel is now fully negotiated and the funding

          transaction published.'
      chan_open:
        $ref: '#/definitions/lnrpcChannelOpenUpdate'
        description: 'Signals that the channel''s funding transaction has now reached the

          required number of confirmations on chain and can be used.'
      psbt_fund:
        $ref: '#/definitions/lnrpcReadyForPsbtFunding'
        description: 'Signals that the funding process has been suspended and the construction

          of a PSBT that funds the channel PK script is now required.'
      pending_chan_id:
        type: string
        format: byte
        description: 'The pending channel ID of the created channel. This value may be used to

          further the funding flow manually via the FundingStateStep method.'
  lnrpcInitiator:
    type: string
    enum:
    - INITIATOR_UNKNOWN
    - INITIATOR_LOCAL
    - INITIATOR_REMOTE
    - INITIATOR_BOTH
    default: INITIATOR_UNKNOWN
  PendingChannelsResponseForceClosedChannel:
    type: object
