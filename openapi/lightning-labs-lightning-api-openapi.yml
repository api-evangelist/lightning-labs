      payment_route:
        $ref: '#/definitions/lnrpcRoute'
      payment_hash:
        type: string
        format: byte
  lnrpcFundingShimCancel:
    type: object
    properties:
      pending_chan_id:
        type: string
        format: byte
        description: The pending channel ID of the channel to cancel the funding shim for.
  lnrpcListUnspentResponse:
    type: object
    properties:
      utxos:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcUtxo'
        title: A list of utxos
  lnrpcVerifyChanBackupResponse:
    type: object
    properties:
      chan_points:
        type: array
        items:
          type: string
  lnrpcVerifyMessageResponse:
    type: object
    properties:
      valid:
        type: boolean
        title: Whether the signature was valid over the given message
      pubkey:
        type: string
        title: The pubkey recovered from the signature
  lnrpcChannelCommitUpdate:
    type: object
    properties:
      channel:
        $ref: '#/definitions/lnrpcChannel'
  PendingChannelsResponsePendingOpenChannel:
    type: object
    properties:
      channel:
        $ref: '#/definitions/PendingChannelsResponsePendingChannel'
        title: The pending channel
      commit_fee:
        type: string
        format: int64
        description: 'The amount calculated to be paid in fees for the current set of

          commitment transactions. The fee amount is persisted with the channel

          in order to allow the fee amount to be removed and recalculated with

          each channel state update, including updates that happen after a system

          restart.'
      commit_weight:
        type: string
        format: int64
        title: The weight of the commitment transaction
      fee_per_kw:
        type: string
        format: int64
        description: 'The required number of satoshis per kilo-weight that the requester will

          pay at all times, for both the funding transaction and commitment

          transaction. This value can later be updated once the channel is open.'
      funding_expiry_blocks:
        type: integer
        format: int32
        description: 'The number of blocks until the funding transaction is considered

          expired. If this value gets close to zero, there is a risk that the

          channel funding will be canceled by the channel responder. The

          channel should be fee bumped using CPFP (see walletrpc.BumpFee) to

          ensure that the channel confirms in time. Otherwise a force-close

          will be necessary if the channel confirms after the funding

          transaction expires. A negative value means the channel responder has

          very likely canceled the funding and the channel will never become

          fully operational.'
      confirmations_until_active:
        type: integer
        format: int64
        description: 'The number of blocks remaining until the channel status changes from

          pending to active. A value of 0 indicates that the channel is now

          active.


          "Active" here means both channel peers have the channel marked OPEN

          and can immediately start using it. For public channels, this does

          not imply a channel_announcement has been gossiped. It only becomes

          public on the network after 6 on‐chain confirmations.

          See BOLT07 "Routing Gossip":

          https://github.com/lightning/bolts/blob/master/07-routing-gossip.md


          ZeroConf channels bypass the pending state entirely: they are marked

          active immediately upon creation, so they never show up as "pending".'
      confirmation_height:
        type: integer
        format: int64
        description: 'The confirmation height records the block height at which the funding

          transaction was first confirmed.'
  lnrpcSendRequest:
    type: object
    properties:
      dest:
        type: string
        format: byte
        description: 'The identity pubkey of the payment recipient. When using REST, this field

          must be encoded as base64.'
      dest_string:
        type: string
        description: 'The hex-encoded identity pubkey of the payment recipient. Deprecated now

          that the REST gateway supports base64 encoding of bytes fields.'
      amt:
        type: string
        format: int64
        description: 'The amount to send expressed in satoshis.


          The fields amt and amt_msat are mutually exclusive.'
      amt_msat:
        type: string
        format: int64
        description: 'The amount to send expressed in millisatoshis.


          The fields amt and amt_msat are mutually exclusive.'
      payment_hash:
        type: string
        format: byte
        description: 'The hash to use within the payment''s HTLC. When using REST, this field

          must be encoded as base64.'
      payment_hash_string:
        type: string
        description: 'The hex-encoded hash to use within the payment''s HTLC. Deprecated now

          that the REST gateway supports base64 encoding of bytes fields.'
      payment_request:
        type: string
        description: 'A bare-bones invoice for a payment within the Lightning Network. With the

          details of the invoice, the sender has all the data necessary to send a

          payment to the recipient.'
      final_cltv_delta:
        type: integer
        format: int32
        description: 'The CLTV delta from the current height that should be used to set the

          timelock for the final hop.'
      fee_limit:
        $ref: '#/definitions/lnrpcFeeLimit'
        description: 'The maximum number of satoshis that will be paid as a fee of the payment.

          This value can be represented either as a percentage of the amount being

          sent, or as a fixed amount of the maximum fee the user is willing the pay to

          send the payment. If not specified, lnd will use a default value of 100%

          fees for small amounts (<=1k sat) or 5% fees for larger amounts.'
      outgoing_chan_id:
        type: string
        format: uint64
        description: 'The channel id of the channel that must be taken to the first hop. If zero,

          any channel may be used.'
      last_hop_pubkey:
        type: string
        format: byte
        description: The pubkey of the last hop of the route. If empty, any hop may be used.
      cltv_limit:
        type: integer
        format: int64
        description: 'An optional maximum total time lock for the route. This should not exceed

          lnd''s `--max-cltv-expiry` setting. If zero, then the value of

          `--max-cltv-expiry` is enforced.'
      dest_custom_records:
        type: object
        additionalProperties:
          type: string
          format: byte
        description: 'An optional field that can be used to pass an arbitrary set of TLV records

          to a peer which understands the new records. This can be used to pass

          application specific data during the payment attempt. Record types are

          required to be in the custom range >= 65536. When using REST, the values

          must be encoded as base64.'
      allow_self_payment:
        type: boolean
        description: If set, circular payments to self are permitted.
      dest_features:
        type: array
        items:
          $ref: '#/definitions/lnrpcFeatureBit'
        description: 'Features assumed to be supported by the final node. All transitive feature

          dependencies must also be set properly. For a given feature bit pair, either

          optional or remote may be set, but not both. If this field is nil or empty,

          the router will try to load destination features from the graph as a

          fallback.'
      payment_addr:
        type: string
        format: byte
        description: 'The payment address of the generated invoice.  This is also called

          payment secret in specifications (e.g. BOLT 11).'
  lnrpcMacaroonPermission:
    type: object
    properties:
      entity:
        type: string
        description: The entity a permission grants access to.
      action:
        type: string
        description: The action that is granted.
  lnrpcForwardingHistoryRequest:
    type: object
    properties:
      start_time:
        type: string
        format: uint64
        description: 'Start time is the starting point of the forwarding history request. All

          records beyond this point will be included, respecting the end time, and

          the index offset.'
      end_time:
        type: string
        format: uint64
        description: 'End time is the end point of the forwarding history request. The

          response will carry at most 50k records between the start time and the

          end time. The index offset can be used to implement pagination.'
      index_offset:
        type: integer
        format: int64
        description: 'Index offset is the offset in the time series to start at. As each

          response can only contain 50k records, callers can use this to skip

          around within a packed time series.'
      num_max_events:
        type: integer
        format: int64
        description: The max number of events to return in the response to this query.
      peer_alias_lookup:
        type: boolean
        description: 'Informs the server if the peer alias should be looked up for each

          forwarding event.'
      incoming_chan_ids:
        type: array
        items:
          type: string
          format: uint64
        title: 'List of incoming channel ids to filter htlcs received from a

          particular channel'
      outgoing_chan_ids:
        type: array
        items:
          type: string
          format: uint64
        title: 'List of outgoing channel ids to filter htlcs being forwarded to a

          particular channel'
  lnrpcNodeMetricsResponse:
    type: object
    properties:
      betweenness_centrality:
        type: object
        additionalProperties:
          $ref: '#/definitions/lnrpcFloatMetric'
        description: 'Betweenness centrality is the sum of the ratio of shortest paths that pass

          through the node for each pair of nodes in the graph (not counting paths

          starting or ending at this node).

          Map of node pubkey to betweenness centrality of the node. Normalized

          values are in the [0,1] closed interval.'
  lnrpcBatchOpenChannel:
    type: object
    properties:
      node_pubkey:
        type: string
        format: byte
        description: 'The pubkey of the node to open a channel with. When using REST, this

          field must be encoded as base64.'
      local_funding_amount:
        type: string
        format: int64
        description: The number of satoshis the wallet should commit to the channel.
      push_sat:
        type: string
        format: int64
        description: 'The number of satoshis to push to the remote side as part of the initial

          commitment state.'
      private:
        type: boolean
        description: 'Whether this channel should be private, not announced to the greater

          network.'
      min_htlc_msat:
        type: string
        format: int64
        description: 'The minimum value in millisatoshi we will require for incoming HTLCs on

          the channel.'
      remote_csv_delay:
        type: integer
        format: int64
        description: 'The delay we require on the remote''s commitment transaction. If this is

          not set, it will be scaled automatically with the channel size.'
      close_address:
        type: string
        description: 'Close address is an optional address which specifies the address to which

          funds should be paid out to upon cooperative close. This field may only be

          set if the peer supports the option upfront feature bit (call listpeers

          to check). The remote peer will only accept cooperative closes to this

          address if it is set.


          Note: If this value is set on channel creation, you will *not* be able to

          cooperatively close out to a different address.'
      pending_chan_id:
        type: string
        format: byte
        description: 'An optional, unique identifier of 32 random bytes that will be used as the

          pending channel ID to identify the channel while it is in the pre-pending

          state.'
      commitment_type:
        $ref: '#/definitions/lnrpcCommitmentType'
        description: 'The explicit commitment type to use. Note this field will only be used if

          the remote peer supports explicit channel negotiation.'
      remote_max_value_in_flight_msat:
        type: string
        format: uint64
        description: 'The maximum amount of coins in millisatoshi that can be pending within

          the channel. It only applies to the remote party.'
      remote_max_htlcs:
        type: integer
        format: int64
        description: 'The maximum number of concurrent HTLCs we will allow the remote party to add

          to the commitment transaction.'
      max_local_csv:
        type: integer
        format: int64
        description: 'Max local csv is the maximum csv delay we will allow for our own commitment

          transaction.'
      zero_conf:
        type: boolean
        description: If this is true, then a zero-conf channel open will be attempted.
      scid_alias:
        type: boolean
        description: 'If this is true, then an option-scid-alias channel-type open will be

          attempted.'
      base_fee:
        type: string
        format: uint64
        description: The base fee charged regardless of the number of milli-satoshis sent.
      fee_rate:
        type: string
        format: uint64
        description: 'The fee rate in ppm (parts per million) that will be charged in

          proportion of the value of each forwarded HTLC.'
      use_base_fee:
        type: boolean
        description: 'If use_base_fee is true the open channel announcement will update the

          channel base fee with the value specified in base_fee. In the case of

          a base_fee of 0 use_base_fee is needed downstream to distinguish whether

          to use the default base fee value specified in the config or 0.'
      use_fee_rate:
        type: boolean
        description: 'If use_fee_rate is true the open channel announcement will update the

          channel fee rate with the value specified in fee_rate. In the case of

          a fee_rate of 0 use_fee_rate is needed downstream to distinguish whether

          to use the default fee rate value specified in the config or 0.'
      remote_chan_reserve_sat:
        type: string
        format: uint64
        description: 'The number of satoshis we require the remote peer to reserve. This value,

          if specified, must be above the dust limit and below 20% of the channel

          capacity.'
      memo:
        type: string
        description: 'An optional note-to-self to go along with the channel containing some

          useful information. This is only ever stored locally and in no way impacts

          the channel''s operation.'
  lnrpcMetadataValues:
    type: object
