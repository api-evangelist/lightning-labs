  lnrpcChannelUpdate:
    type: object
    properties:
      signature:
        type: string
        format: byte
        description: 'The signature that validates the announced data and proves the ownership

          of node id.'
      chain_hash:
        type: string
        format: byte
        description: 'The target chain that this channel was opened within. This value

          should be the genesis hash of the target chain. Along with the short

          channel ID, this uniquely identifies the channel globally in a

          blockchain.'
      chan_id:
        type: string
        format: uint64
        description: The unique description of the funding transaction.
      timestamp:
        type: integer
        format: int64
        description: 'A timestamp that allows ordering in the case of multiple announcements.

          We should ignore the message if timestamp is not greater than the

          last-received.'
      message_flags:
        type: integer
        format: int64
        description: 'The bitfield that describes whether optional fields are present in this

          update. Currently, the least-significant bit must be set to 1 if the

          optional field MaxHtlc is present.'
      channel_flags:
        type: integer
        format: int64
        description: 'The bitfield that describes additional meta-data concerning how the

          update is to be interpreted. Currently, the least-significant bit must be

          set to 0 if the creating node corresponds to the first node in the

          previously sent channel announcement and 1 otherwise. If the second bit

          is set, then the channel is set to be disabled.'
      time_lock_delta:
        type: integer
        format: int64
        description: 'The minimum number of blocks this node requires to be added to the expiry

          of HTLCs. This is a security parameter determined by the node operator.

          This value represents the required gap between the time locks of the

          incoming and outgoing HTLC''s set to this node.'
      htlc_minimum_msat:
        type: string
        format: uint64
        description: The minimum HTLC value which will be accepted.
      base_fee:
        type: integer
        format: int64
        description: 'The base fee that must be used for incoming HTLC''s to this particular

          channel. This value will be tacked onto the required for a payment

          independent of the size of the payment.'
      fee_rate:
        type: integer
        format: int64
        description: The fee rate that will be charged per millionth of a satoshi.
      htlc_maximum_msat:
        type: string
        format: uint64
        description: The maximum HTLC value which will be accepted.
      extra_opaque_data:
        type: string
        format: byte
        description: 'The set of data that was appended to this message, some of which we may

          not actually know how to iterate or parse. By holding onto this data, we

          ensure that we''re able to properly validate the set of signatures that

          cover these new fields, and ensure we''re able to make upgrades to the

          network in a forwards compatible manner.'
