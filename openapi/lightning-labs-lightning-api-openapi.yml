        description: 'The index of the last item in the set of returned payments. This can be used

          as the index_offset to continue seeking forwards in the next request.'
      total_num_payments:
        type: string
        format: uint64
        description: 'Will only be set if count_total_payments in the request was set. Represents

          the total number of payments (complete and incomplete, independent of the

          number of payments requested in the query) currently present in the payments

          database.'
  lnrpcPolicyUpdateRequest:
    type: object
    properties:
      global:
        type: boolean
        description: If set, then this update applies to all currently active channels.
      chan_point:
        $ref: '#/definitions/lnrpcChannelPoint'
        description: If set, this update will target a specific channel.
      base_fee_msat:
        type: string
        format: int64
        description: The base fee charged regardless of the number of milli-satoshis sent.
      fee_rate:
        type: number
        format: double
        description: 'The effective fee rate in milli-satoshis. The precision of this value

          goes up to 6 decimal places, so 1e-6.'
      fee_rate_ppm:
        type: integer
        format: int64
        description: The effective fee rate in micro-satoshis (parts per million).
      time_lock_delta:
        type: integer
        format: int64
        description: The required timelock delta for HTLCs forwarded over the channel.
      max_htlc_msat:
        type: string
        format: uint64
        description: 'If set, the maximum HTLC size in milli-satoshis. If unset, the maximum

          HTLC will be unchanged.'
      min_htlc_msat:
        type: string
        format: uint64
        description: 'The minimum HTLC size in milli-satoshis. Only applied if

          min_htlc_msat_specified is true.'
      min_htlc_msat_specified:
        type: boolean
        description: If true, min_htlc_msat is applied.
      inbound_fee:
        $ref: '#/definitions/lnrpcInboundFee'
        description: 'Optional inbound fee. If unset, the previously set value will be

          retained [EXPERIMENTAL].'
      create_missing_edge:
        type: boolean
        description: 'Under unknown circumstances a channel can exist with a missing edge in

          the graph database. This can cause an ''edge not found'' error when calling

          `getchaninfo` and/or cause the default channel policy to be used during

          forwards. Setting this flag will recreate the edge if not found, allowing

          updating this channel policy and fixing the missing edge problem for this

          channel permanently. For fields not set in this command, the default

          policy will be created.'
  lnrpcSendCustomMessageRequest:
    type: object
    properties:
      peer:
        type: string
        format: byte
        title: 'Peer to which the message will be sent. Represented as a byte-encoded

          public key'
      type:
        type: integer
        format: int64
        description: 'Message type. This value needs to be in the custom range (>= 32768).

          To send a type < custom range, lnd needs to be compiled with the `dev`

          build tag, and the message type to override should be specified in lnd''s

          experimental protocol configuration.'
      data:
        type: string
        format: byte
        description: Raw message data.
  PendingChannelsResponseCommitments:
