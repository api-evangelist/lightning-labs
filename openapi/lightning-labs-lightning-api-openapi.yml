        description: 'The amount in satoshis calculated to be paid in fees for the local

          commitment.'
      remote_commit_fee_sat:
        type: string
        format: uint64
        description: 'The amount in satoshis calculated to be paid in fees for the remote

          commitment.'
      remote_pending_commit_fee_sat:
        type: string
        format: uint64
        description: 'The amount in satoshis calculated to be paid in fees for the remote

          pending commitment.'
  ChannelEventUpdateUpdateType:
