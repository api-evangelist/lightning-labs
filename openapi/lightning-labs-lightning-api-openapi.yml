      push_amt:
        type: string
        format: uint64
        description: The push amount of the proposed channel in millisatoshis.
      dust_limit:
        type: string
        format: uint64
        description: The dust limit of the initiator's commitment tx.
      max_value_in_flight:
        type: string
        format: uint64
        description: 'The maximum amount of coins in millisatoshis that can be pending in this

