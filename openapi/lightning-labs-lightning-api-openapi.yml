      outpoint:
        type: string
        title: The final output to be swept back to the user's wallet
      maturity_height:
        type: integer
        format: int64
        title: The next block height at which we can spend the current stage
      blocks_til_maturity:
        type: integer
        format: int32
        description: 'The number of blocks remaining until the current stage can be swept.

          Negative values indicate how many blocks have passed since becoming

