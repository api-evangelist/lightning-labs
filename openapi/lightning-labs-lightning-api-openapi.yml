        title: The amount in satoshis to send
      target_conf:
        type: integer
        format: int32
        description: 'The target number of blocks that this transaction should be confirmed

          by.'
      sat_per_vbyte:
        type: string
        format: uint64
        description: 'A manual fee rate set in sat/vbyte that should be used when crafting the

          transaction.'
      sat_per_byte:
        type: string
        format: int64
        description: 'Deprecated, use sat_per_vbyte.

          A manual fee rate set in sat/vbyte that should be used when crafting the

          transaction.'
      send_all:
        type: boolean
        description: 'If set, the amount field should be unset. It indicates lnd will send all

          wallet coins or all selected coins to the specified address.'
      label:
        type: string
        description: An optional label for the transaction, limited to 500 characters.
      min_confs:
        type: integer
        format: int32
        description: 'The minimum number of confirmations each one of your outputs used for

          the transaction must satisfy.'
      spend_unconfirmed:
        type: boolean
        description: Whether unconfirmed outputs should be used as inputs for the transaction.
      coin_selection_strategy:
        $ref: '#/definitions/lnrpcCoinSelectionStrategy'
        description: The strategy to use for selecting coins.
      outpoints:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcOutPoint'
        description: A list of selected outpoints as inputs for the transaction.
  lnrpcMultiChanBackup:
    type: object
    properties:
      chan_points:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcChannelPoint'
        description: Is the set of all channels that are included in this multi-channel backup.
      multi_chan_backup:
        type: string
        format: byte
        description: 'A single encrypted blob containing all the static channel backups of the

          channel listed above. This can be stored as a single file or blob, and

          safely be replaced with any prior/future versions. When using REST, this

          field must be encoded as base64.'
  lnrpcSendOnionMessageRequest:
    type: object
    properties:
      peer:
        type: string
        format: byte
        title: Peer to send the message to
      path_key:
        type: string
        format: byte
        description: 'PathKey is used to derive the blinded node id by tweaking the hop''s

          static public key. The hop uses the corresponding blinded private key

          together with the sender''s ephemeral key to perform ECDH and obtain the

          shared secret for decrypting the onion payload. Separately, for

          decrypting `encrypted_recipient_data`, the recipient performs ECDH

          between its static node private key and the path_key to derive the

          decryption key.'
      onion:
        type: string
        format: byte
        description: 'Serialized Sphinx onion packet (BOLT 4) containing the layered, per-hop

          encrypted payloads and routing instructions used to forward this message

          along its designated path.'
  lnrpcNodeAddress:
    type: object
    properties:
      network:
        type: string
      addr:
        type: string
  lnrpcListChannelsResponse:
    type: object
    properties:
      channels:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcChannel'
        title: The list of active channels
  lnrpcOpenChannelRequest:
    type: object
    properties:
      sat_per_vbyte:
        type: string
        format: uint64
        description: 'A manual fee rate set in sat/vbyte that should be used when crafting the

          funding transaction.'
      node_pubkey:
        type: string
        format: byte
        description: 'The pubkey of the node to open a channel with. When using REST, this field

          must be encoded as base64.'
      node_pubkey_string:
        type: string
        description: 'The hex encoded pubkey of the node to open a channel with. Deprecated now

          that the REST gateway supports base64 encoding of bytes fields.'
      local_funding_amount:
        type: string
        format: int64
        title: The number of satoshis the wallet should commit to the channel
      push_sat:
        type: string
        format: int64
        title: 'The number of satoshis to push to the remote side as part of the initial

          commitment state'
      target_conf:
        type: integer
        format: int32
        description: 'The target number of blocks that the funding transaction should be

          confirmed by.'
      sat_per_byte:
        type: string
        format: int64
        description: 'Deprecated, use sat_per_vbyte.

          A manual fee rate set in sat/vbyte that should be used when crafting the

          funding transaction.'
      private:
        type: boolean
        description: 'Whether this channel should be private, not announced to the greater

          network.'
      min_htlc_msat:
        type: string
        format: int64
        description: 'The minimum value in millisatoshi we will require for incoming HTLCs on

          the channel.'
      remote_csv_delay:
        type: integer
        format: int64
        description: 'The delay we require on the remote''s commitment transaction. If this is

          not set, it will be scaled automatically with the channel size.'
      min_confs:
        type: integer
        format: int32
        description: 'The minimum number of confirmations each one of your outputs used for

          the funding transaction must satisfy.'
      spend_unconfirmed:
        type: boolean
        description: 'Whether unconfirmed outputs should be used as inputs for the funding

          transaction.'
      close_address:
        type: string
        description: 'Close address is an optional address which specifies the address to which

          funds should be paid out to upon cooperative close. This field may only be

          set if the peer supports the option upfront feature bit (call listpeers

          to check). The remote peer will only accept cooperative closes to this

          address if it is set.


          Note: If this value is set on channel creation, you will *not* be able to

          cooperatively close out to a different address.'
      funding_shim:
        $ref: '#/definitions/lnrpcFundingShim'
        description: 'Funding shims are an optional argument that allow the caller to intercept

          certain funding functionality. For example, a shim can be provided to use a

          particular key for the commitment key (ideally cold) rather than use one

          that is generated by the wallet as normal, or signal that signing will be

          carried out in an interactive manner (PSBT based).'
      remote_max_value_in_flight_msat:
        type: string
        format: uint64
        description: 'The maximum amount of coins in millisatoshi that can be pending within

          the channel. It only applies to the remote party.'
      remote_max_htlcs:
        type: integer
        format: int64
        description: 'The maximum number of concurrent HTLCs we will allow the remote party to add

          to the commitment transaction.'
      max_local_csv:
        type: integer
        format: int64
        description: 'Max local csv is the maximum csv delay we will allow for our own commitment

          transaction.'
      commitment_type:
        $ref: '#/definitions/lnrpcCommitmentType'
        description: 'The explicit commitment type to use. Note this field will only be used if

          the remote peer supports explicit channel negotiation.'
      zero_conf:
        type: boolean
        description: If this is true, then a zero-conf channel open will be attempted.
      scid_alias:
        type: boolean
        description: 'If this is true, then an option-scid-alias channel-type open will be

          attempted.'
      base_fee:
        type: string
        format: uint64
        description: The base fee charged regardless of the number of milli-satoshis sent.
      fee_rate:
        type: string
        format: uint64
        description: 'The fee rate in ppm (parts per million) that will be charged in

          proportion of the value of each forwarded HTLC.'
      use_base_fee:
        type: boolean
        description: 'If use_base_fee is true the open channel announcement will update the

          channel base fee with the value specified in base_fee. In the case of

          a base_fee of 0 use_base_fee is needed downstream to distinguish whether

          to use the default base fee value specified in the config or 0.'
      use_fee_rate:
        type: boolean
        description: 'If use_fee_rate is true the open channel announcement will update the

          channel fee rate with the value specified in fee_rate. In the case of

          a fee_rate of 0 use_fee_rate is needed downstream to distinguish whether

          to use the default fee rate value specified in the config or 0.'
      remote_chan_reserve_sat:
        type: string
        format: uint64
        description: 'The number of satoshis we require the remote peer to reserve. This value,

          if specified, must be above the dust limit and below 20% of the channel

          capacity.'
      fund_max:
        type: boolean
        description: 'If set, then lnd will attempt to commit all the coins under control of the

          internal wallet to open the channel, and the LocalFundingAmount field must

          be zero and is ignored.'
      memo:
        type: string
        description: 'An optional note-to-self to go along with the channel containing some

          useful information. This is only ever stored locally and in no way impacts

          the channel''s operation.'
      outpoints:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcOutPoint'
        description: A list of selected outpoints that are allocated for channel funding.
  lnrpcStreamAuth:
    type: object
