        title: The balance in satoshis encumbered in pending channels
      pending_open_channels:
        type: array
        items:
          type: object
          $ref: '#/definitions/PendingChannelsResponsePendingOpenChannel'
        title: Channels pending opening
      pending_closing_channels:
        type: array
        items:
          type: object
          $ref: '#/definitions/PendingChannelsResponseClosedChannel'
        description: 'Deprecated: Channels pending closing previously contained cooperatively

          closed channels with a single confirmation. These channels are now

          considered closed from the time we see them on chain.'
      pending_force_closing_channels:
        type: array
        items:
          type: object
          $ref: '#/definitions/PendingChannelsResponseForceClosedChannel'
        title: Channels pending force closing
      waiting_close_channels:
        type: array
        items:
          type: object
          $ref: '#/definitions/PendingChannelsResponseWaitingCloseChannel'
        title: Channels waiting for closing tx to confirm
  lnrpcCommitmentType:
    type: string
    enum:
    - UNKNOWN_COMMITMENT_TYPE
    - LEGACY
    - STATIC_REMOTE_KEY
    - ANCHORS
    - SCRIPT_ENFORCED_LEASE
    - SIMPLE_TAPROOT
    - SIMPLE_TAPROOT_FINAL
    - SIMPLE_TAPROOT_OVERLAY
    default: UNKNOWN_COMMITMENT_TYPE
    description: " - UNKNOWN_COMMITMENT_TYPE: Returned when the commitment type isn't known or unavailable.\n - LEGACY: A channel using the legacy commitment format having tweaked to_remote\nkeys.\n - STATIC_REMOTE_KEY: A channel that uses the modern commitment format where the key in the\noutput of the remote party does not change each state. This makes back\nup and recovery easier as when the channel is closed, the funds go\ndirectly to that key.\n - ANCHORS: A channel that uses a commitment format that has anchor outputs on the\ncommitments, allowing fee bumping after a force close transaction has\nbeen broadcast.\n - SCRIPT_ENFORCED_LEASE: A channel that uses a commitment type that builds upon the anchors\ncommitment format, but in addition requires a CLTV clause to spend outputs\npaying to the channel initiator. This is intended for use on leased channels\nto guarantee that the channel initiator has no incentives to close a leased\nchannel before its maturity date.\n - SIMPLE_TAPROOT: A channel that uses musig2 for the funding output, and the new tapscript\nfeatures where relevant. This is the staging version using development\nscripts.\n - SIMPLE_TAPROOT_FINAL: A channel that uses musig2 for the funding output, and the new tapscript\nfeatures where relevant. This is the production version using final scripts\nand feature bits 80/81.\n - SIMPLE_TAPROOT_OVERLAY: Identical to the SIMPLE_TAPROOT channel type, but with extra functionality.\nThis channel type also commits to additional meta data in the tapscript\nleaves for the scripts in a channel."
  lnrpcFloatMetric:
    type: object
    properties:
      value:
        type: number
        format: double
        description: Arbitrary float value.
      normalized_value:
        type: number
        format: double
        description: The value normalized to [0,1] or [-1,1].
  lnrpcResolution:
    type: object
    properties:
      resolution_type:
        $ref: '#/definitions/lnrpcResolutionType'
        description: The type of output we are resolving.
      outcome:
        $ref: '#/definitions/lnrpcResolutionOutcome'
        description: The outcome of our on chain action that resolved the outpoint.
      outpoint:
        $ref: '#/definitions/lnrpcOutPoint'
        description: The outpoint that was spent by the resolution.
      amount_sat:
        type: string
        format: uint64
        description: The amount that was claimed by the resolution.
      sweep_txid:
        type: string
        description: 'The hex-encoded transaction ID of the sweep transaction that spent the

          output.'
  lnrpcNetworkInfo:
    type: object
    properties:
      graph_diameter:
        type: integer
        format: int64
      avg_out_degree:
        type: number
        format: double
      max_out_degree:
        type: integer
        format: int64
      num_nodes:
        type: integer
        format: int64
      num_channels:
        type: integer
        format: int64
      total_network_capacity:
        type: string
        format: int64
      avg_channel_size:
        type: number
        format: double
      min_channel_size:
        type: string
        format: int64
      max_channel_size:
        type: string
        format: int64
      median_channel_size_sat:
        type: string
        format: int64
      num_zombie_chans:
        type: string
        format: uint64
        description: The number of edges marked as zombies.
  lnrpcDeletePaymentResponse:
    type: object
    properties:
      status:
        type: string
        description: The status of the delete operation.
  lnrpcResolutionOutcome:
    type: string
    enum:
    - OUTCOME_UNKNOWN
    - CLAIMED
    - UNCLAIMED
    - ABANDONED
    - FIRST_STAGE
    - TIMEOUT
    default: OUTCOME_UNKNOWN
    description: " - OUTCOME_UNKNOWN: Outcome unknown.\n - CLAIMED: An output was claimed on chain.\n - UNCLAIMED: An output was left unclaimed on chain.\n - ABANDONED: ResolverOutcomeAbandoned indicates that an output that we did not\nclaim on chain, for example an anchor that we did not sweep and a\nthird party claimed on chain, or a htlc that we could not decode\nso left unclaimed.\n - FIRST_STAGE: If we force closed our channel, our htlcs need to be claimed in two\nstages. This outcome represents the broadcast of a timeout or success\ntransaction for this two stage htlc claim.\n - TIMEOUT: A htlc was timed out on chain."
  lnrpcCheckMacPermRequest:
    type: object
    properties:
      macaroon:
        type: string
        format: byte
        description: 'The macaroon to check permissions for, serialized in binary format. For

          a macaroon to be valid, it must have been issued by lnd, must succeed all

          caveat conditions, and must contain all of the permissions specified in

          the permissions field.'
      permissions:
        type: array
        items:
          type: object
          $ref: '#/definitions/lnrpcMacaroonPermission'
        description: 'The list of permissions the macaroon should be checked against. Only if

          the macaroon contains all of these permissions, it is considered valid.

          If the list of permissions given is empty, then the macaroon is

          considered valid only based on issuance authority and caveat validity.

          An empty list of permissions is therefore equivalent to saying "skip

          checking permissions" (unless check_default_perms_from_full_method is

          specified).'
      fullMethod:
        type: string
        description: 'The RPC method to check the macaroon against. This is only used if there

          are custom `uri:<rpcpackage>.<ServiceName>/<MethodName>` permissions in

          the permission list above. To check a macaroon against the list of

          permissions of a certain RPC method, query the `ListPermissions` RPC

          first, extract the permissions for the method, and then pass them in the

          `permissions` field above.'
      check_default_perms_from_full_method:
        type: boolean
        description: 'If this field is set to true, then the permissions list above MUST be

          empty. The default permissions for the provided fullMethod will be used

          to check the macaroon. This is equivalent to looking up the permissions

          for a method in the `ListPermissions` RPC and then calling this RPC with

          the permission list returned from that call. Without this flag, the list

          of permissions must be non-empty for the check to actually perform a

          permission check.'
  lnrpcDeleteMacaroonIDResponse:
    type: object
    properties:
      deleted:
        type: boolean
        description: A boolean indicates that the deletion is successful.
  lnrpcCoinSelectionStrategy:
    type: string
    enum:
    - STRATEGY_USE_GLOBAL_CONFIG
    - STRATEGY_LARGEST
    - STRATEGY_RANDOM
    default: STRATEGY_USE_GLOBAL_CONFIG
    description: " - STRATEGY_USE_GLOBAL_CONFIG: Use the coin selection strategy defined in the global configuration\n(lnd.conf).\n - STRATEGY_LARGEST: Select the largest available coins first during coin selection.\n - STRATEGY_RANDOM: Randomly select the available coins during coin selection."
  lnrpcLookupHtlcResolutionResponse:
    type: object
    properties:
      settled:
        type: boolean
        description: Settled is true is the htlc was settled. If false, the htlc was failed.
      offchain:
        type: boolean
        description: Offchain indicates whether the htlc was resolved off-chain or on-chain.
  lnrpcAMP:
    type: object
    properties:
      root_share:
        type: string
        format: byte
        description: 'An n-of-n secret share of the root seed from which child payment hashes

          and preimages are derived.'
      set_id:
        type: string
        format: byte
        description: An identifier for the HTLC set that this HTLC belongs to.
      child_index:
        type: integer
        format: int64
        description: 'A nonce used to randomize the child preimage and child hash from a given

          root_share.'
      hash:
        type: string
        format: byte
        description: The payment hash of the AMP HTLC.
      preimage:
        type: string
        format: byte
        description: 'The preimage used to settle this AMP htlc. This field will only be

          populated if the invoice is in InvoiceState_ACCEPTED or

          InvoiceState_SETTLED.'
    description: Details specific to AMP HTLCs.
  lnrpcFailedUpdate:
    type: object
    properties:
      outpoint:
        $ref: '#/definitions/lnrpcOutPoint'
        title: The outpoint in format txid:n
      reason:
        $ref: '#/definitions/lnrpcUpdateFailure'
        description: Reason for the policy update failure.
      update_error:
        type: string
        description: A string representation of the policy update error.
  lnrpcTimestampedError:
    type: object
    properties:
      timestamp:
        type: string
        format: uint64
        description: The unix timestamp in seconds when the error occurred.
      error:
        type: string
        description: The string representation of the error sent by our peer.
  lnrpcChannelPoint:
    type: object
    properties:
      funding_txid_bytes:
        type: string
        format: byte
        description: 'Txid of the funding transaction. When using REST, this field must be

          encoded as base64.'
      funding_txid_str:
        type: string
        description: 'Hex-encoded string representing the byte-reversed hash of the funding

          transaction.'
      output_index:
        type: integer
        format: int64
        title: The index of the output of the funding transaction
