      channel:
        $ref: '#/definitions/PendingChannelsResponsePendingChannel'
        title: The pending channel to be closed
      closing_txid:
        type: string
        title: The transaction id of the closing transaction
  lnrpcChannelAcceptResponse:
    type: object
    properties:
      accept:
        type: boolean
        description: Whether or not the client accepts the channel.
      pending_chan_id:
        type: string
        format: byte
        description: The pending channel id to which this response applies.
      error:
        type: string
        description: 'An optional error to send the initiating party to indicate why the channel

          was rejected. This field *should not* contain sensitive information, it will

          be sent to the initiating party. This field should only be set if accept is

          false, the channel will be rejected if an error is set with accept=true

          because the meaning of this response is ambiguous. Limited to 500

          characters.'
      upfront_shutdown:
        type: string
        description: 'The upfront shutdown address to use if the initiating peer supports option

          upfront shutdown script (see ListPeers for the features supported). Note

          that the channel open will fail if this value is set for a peer that does

          not support this feature bit.'
      csv_delay:
        type: integer
        format: int64
        description: The csv delay (in blocks) that we require for the remote party.
      reserve_sat:
        type: string
        format: uint64
        description: 'The reserve amount in satoshis that we require the remote peer to adhere to.

          We require that the remote peer always have some reserve amount allocated to

          them so that there is always a disincentive to broadcast old state (if they

          hold 0 sats on their side of the channel, there is nothing to lose).'
      in_flight_max_msat:
        type: string
        format: uint64
        description: 'The maximum amount of funds in millisatoshis that we allow the remote peer

          to have in outstanding htlcs.'
      max_htlc_count:
        type: integer
        format: int64
        description: The maximum number of htlcs that the remote peer can offer us.
      min_htlc_in:
        type: string
        format: uint64
        description: The minimum value in millisatoshis for incoming htlcs on the channel.
      min_accept_depth:
        type: integer
        format: int64
        description: The number of confirmations we require before we consider the channel open.
      zero_conf:
        type: boolean
        description: 'Whether the responder wants this to be a zero-conf channel. This will fail

          if either side does not have the scid-alias feature bit set. The minimum

          depth field must be zero if this is true.'
  lnrpcStopRequest:
    type: object
  lnrpcChannelEdgeUpdate:
    type: object
