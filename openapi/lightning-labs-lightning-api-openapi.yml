      payment_request:
        type: string
        description: 'A bare-bones invoice for a payment within the Lightning Network. With the

          details of the invoice, the sender has all the data necessary to send a

          payment to the recipient.'
      add_index:
        type: string
        format: uint64
        description: 'The "add" index of this invoice. Each newly created invoice will increment

          this index making it monotonically increasing. Callers to the

          SubscribeInvoices call can use this to instantly get notified of all added

          invoices with an add_index greater than this one.'
      payment_addr:
        type: string
        format: byte
        description: 'The payment address of the generated invoice. This is also called

          payment secret in specifications (e.g. BOLT 11). This value should be used

          in all payments for this invoice as we require it for end to end security.'
  lnrpcSendCoinsResponse:
    type: object
    properties:
      txid:
        type: string
        title: The transaction ID of the transaction
  lnrpcSendToRouteRequest:
    type: object
    properties:
      payment_hash:
