          node, so if it is 1, then the path will contain our node along with an

          introduction node or dummy node hop. If paths shorter than NumHops is

          found, then they will be padded using dummy hops.'
      max_num_paths:
        type: integer
        format: int64
        description: The maximum number of blinded paths to select and add to an invoice.
      node_omission_list:
        type: array
        items:
          type: string
          format: byte
        description: 'A list of node IDs of nodes that should not be used in any of our generated

          blinded paths.'
      incoming_channel_list:
        type: array
        items:
          type: string
          format: uint64
        description: 'The chained channels list specified via channel id (separated by commas),

          starting from a channel owned by the receiver node.'
